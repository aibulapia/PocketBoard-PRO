       .dark { color-scheme: dark; }
       /* 참고: dark 클래스는 앱 최상위 wrapper(#root 내부)에 붙으므로 <body> 배경은
          이 규칙으로 못 바꾼다. 실사용 시 wrapper가 화면을 꽉 채워 body는 안 보인다. */

       // ── 카톡 인앱브라우저 → 기본 브라우저 유도 (3번) ──────────
       (function () {
           try {
               const ua = navigator.userAgent || "";
               if (!/KAKAOTALK/i.test(ua)) return;
               const url = location.href;
               if (/android/i.test(ua)) {
                   // 카카오톡 공식 외부브라우저 스킴 → 실패 대비 intent 폴백
                   location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
                   setTimeout(() => {
                       location.href =
                           "intent://" + url.replace(/^https?:\/\//, "") +
                           "#Intent;scheme=https;package=com.android.chrome;end";
                   }, 800);
               } else {
                   // iOS: 자동 이동 제약 → 안내 오버레이 표시
                   window.__KAKAO_IOS__ = true;
               }
           } catch (e) { /* 무시 */ }
       })();

       // ── PWA 설치 프롬프트 캡처 (Android Chrome) ──────────

       window.addEventListener("beforeinstallprompt", (e) => {
           e.preventDefault();
           window.__PWA_PROMPT__ = e;

 <script type="text/babel" data-presets="react-classic">
       const { useState, useEffect, useMemo, useRef } = React;

       // 앱 버전 및 관리 암호 (클라이언트 노출 전제 — 실수 방지용 잠금 수준)
       const APP_VERSION = "2.22H";
       // 암호는 SHA-256 해시로만 소스에 존재 (원본 문자열 미노출)
       //  초기화: "1895" / 회사명 수정: "98951895"
       const RESET_PW_HASH = "5932cb6e58ef979208d6b91fcfe0d47c278d78451e733978d35f8b14db88c305";
       const COMPANY_PW_HASH = "9b8b07c4e3c66b4d87a577084b123623acb867927cf1e82799b8cf19477bc31c";
       async function sha256(text) {
           const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
           return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
       }

       // ── 외부 데이터 (data.js) ─────────────────────────
       const D = window.APP_DATA || {};
       const SUPPORTED_FACTORIES = D.SUPPORTED_FACTORIES || [];
       const SUB_FACTORIES = D.SUB_FACTORIES || {};
       const FIXED_SUPERVISORS = D.FIXED_SUPERVISORS || {};
       const FLOOR_TABS = D.FLOOR_TABS || ["B1","1층","2층","2.5층","3층","옥상","옥외"];
       const WORK_TYPE_SAFETY = D.WORK_TYPE_SAFETY || {};
       // (v2.22b) 카드 목록에서 '안전보고문 복사 + 공사단계'를 노출할 공장.
       //  시범 운영이라 우선 5공장만. 확대할 때 이 배열에 공장명을 추가하면 됨.

       // (v2.22H) 도움말 — 화면 흐름 순서(공사 리스트 → 공사 세부)로 정리한 FAQ
       const HELP_ITEMS = [
           { id: "h1", group: "📋 공사 리스트 화면", q: "공사 코드가 뭔가요?",
             a: "같은 코드를 쓰는 사람끼리 데이터가 공유됩니다. 팀별로 자유롭게 설정하세요." },
           { id: "h2", group: "📋 공사 리스트 화면", q: "내 공장 설정은 왜 필요한가요?",

           { id: "h3", group: "📋 공사 리스트 화면", q: "TODAY 배지가 뭔가요?",
             a: "오늘 배정된 공사에 파란 배지가 붙습니다. 터치하면 회색(취소)↔파랑 전환되고, 2일째부터 \"N일째\"도 표시됩니다." },
           { id: "h4", group: "📋 공사 리스트 화면", q: "날짜 이동은 어떻게 하나요?",
             a: "◀▶ 화살표로 넘기고, 가운데 날짜를 터치하면 오늘로 바로 이동합니다." },
           { id: "h5", group: "📝 공사 세부 화면", q: "즐겨찾기는 뭔가요?",
             a: "오늘 볼 공사 하나를 찜하면, 앱을 열자마자 바로 뜹니다 (매일 06시 자동 해제)." },
           { id: "h6", group: "📝 공사 세부 화면", q: "\"안전보고문\"은 뭔가요?",
             a: "5공장 전용 기능. 공사전/중/종료 단계별로 작업·체감온도·폭염대책을 자동으로 정리해 복사해줍니다. (체감온도 기록 없으면 먼저 측정 필요) 상세화면은 전 공장 사용 가능합니다." },
           { id: "h7", group: "📝 공사 세부 화면", q: "공사 연장은 어떻게 하나요?",
             a: "17시 이후 계속되면 \"⏰ 작업연장\"에서 종료 시각을 선택하세요. 카드·카톡복사·보고문에 자동 반영됩니다." },
           { id: "h8", group: "📝 공사 세부 화면", q: "카톡 복사는 어떻게 하나요?",
             a: "\"💬 카톡복사\" 누르면 공사명·위치·감독자·인원이 정리돼 클립보드에 복사됩니다. 카톡방에 붙여넣기만 하면 됩니다." },
       ];

       // ── 06시 일일 체계 유틸 (하루 = 06:00 ~ 익일 05:59) ──
       const WORKDAY_SHIFT_MS = 6 * 60 * 60 * 1000;
       const getWorkdayDate = (d = new Date()) => new Date(d.getTime() - WORKDAY_SHIFT_MS);
       const getWorkdayKey = (d = new Date()) => {
           const t = getWorkdayDate(d);
           return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
       };
       const getWorkdayDow = (d = new Date()) => getWorkdayDate(d).getDay();
       // (19번+26번) dateWorkers의 작업일(day 숫자)들을 각각 실제 날짜로 환산 후 가장 늦은 날짜를 종료일로.
       //  월 걸침 연속공사(예: 7/31~8/9) 대응: day가 업로드일보다 15일 이상 작으면 익월로 간주.
       //  (구버전 '최대 숫자=종료일'은 7월31 > 8월9 를 오판 → 조기삭제 버그. 실제 날짜 비교로 수정.)
       // (v2.19) 날짜별 인원 조회 공통 헬퍼
       //  · dateWorkers 키는 원래 요일(0~6)이었으나, 9일 이상 기간에서는 같은 요일이 두 번 나와
       //    나중 컬럼이 앞 컬럼을 덮어쓰는 문제가 있었다(예: 8/1(토)이 8/8(토)에 밀려 소실).
       //    v2.19부터 키가 차 있으면 +7씩 밀어 저장하므로 한 칸에 하나의 날짜만 들어간다.
       //  · 조회는 키가 아니라 저장된 month/day 값을 대조한다.
       //    month는 v2.19부터 기록되며, 없는 구버전 데이터는 day+요일로 폴백한다.
       const findDayWorkers = (dateWorkers, targetDate) => {
           if (!dateWorkers || !targetDate) return null;
           const tDay = targetDate.getDate();
           const tMonth = targetDate.getMonth() + 1;
           const tDow = targetDate.getDay();
           for (const key of Object.keys(dateWorkers)) {
               const dw = dateWorkers[key];
               if (!dw || Number(dw.day) !== tDay) continue;
               // 월 정보가 있으면 월까지 일치해야 함 (v2.19~)
               if (dw.month != null) {
                   if (Number(dw.month) === tMonth) return dw;
                   continue;
               }
               // 구버전(월 정보 없음): 요일까지 맞아야 채택.
               //  day만 맞다고 채택하면 다른 달의 같은 날짜가 잘못 잡힌다.
               if (Number(key) % 7 === tDow) return dw;
           }
           return null;
       };
       const workersOn = (dateWorkers, targetDate) => Number(findDayWorkers(dateWorkers, targetDate)?.workers) || 0;

       const computeEndDate = (dateWorkers, base = new Date()) => {
           const entries = Object.values(dateWorkers || {}).filter(dw => Number(dw?.day) > 0);
           if (!entries.length) return null;
           const y = base.getFullYear(), m = base.getMonth(), today = base.getDate();
           const dates = entries.map(dw => {
               const d = Number(dw.day);
               // (v2.19) 월 정보가 있으면 그대로 사용 — 월 추정으로 인한 오판 방지
               if (dw.month != null) {
                   const mm = Number(dw.month) - 1;
                   // 연말(12월 표를 1월에 조회 등) 대비: 기준월보다 6개월 이상 앞서면 전년도로 간주
                   const yy = (mm - m > 6) ? y - 1 : (m - mm > 6) ? y + 1 : y;
                   return new Date(yy, mm, d);
               }
               return (d < today - 15) ? new Date(y, m + 1, d) : new Date(y, m, d);
           });
           const latest = new Date(Math.max(...dates.map(dt => dt.getTime())));
           return `${latest.getFullYear()}-${String(latest.getMonth() + 1).padStart(2, "0")}-${String(latest.getDate()).padStart(2, "0")}`;
       };
       // 17시 이후(~익일 06시 전) 여부 — 목록 배지 전환용
       const isAfter17 = (d = new Date()) => { const h = d.getHours(); return h >= 17 || h < 6; };
       // 연장 표기: "22시연장" / "01시연장" (24시간제, 2자리)
       const fmtExtend = (h) => (h == null ? "" : `${String(h).padStart(2, "0")}시연장`);
       // 체감온도 소수점 1자리 통일 표기
       const fmt1 = (v) => { const n = Number(v); return isNaN(n) ? String(v) : n.toFixed(1); };
       // "HH:MM" (24h) 현재 시각
       const nowHm = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
       // 구형 기록(오전/오후 표기) → "HH:MM" 변환
       const toHm24 = (r) => {
           if (r.hm) return r.hm;
           const s = String(r.time || "");
           const m = s.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
           if (!m) return null;
           let h = parseInt(m[2], 10);
           if (m[1] === "오후" && h < 12) h += 12;
           if (m[1] === "오전" && h === 12) h = 0;
           return `${String(h).padStart(2, "0")}:${m[3]}`;
       };

       // 공장 이름 자동 보정 로직
       const normalizeFactoryName = (rawName) => {
           if (!rawName) return "9.기타";
           const name = rawName.toString().trim();
           if (name.includes("1공장") || name === "1") return "1공장";
           if (name.includes("2공장") || name === "2") return "2공장";
           if (name.includes("3공장") || name === "3") return "3공장";
           if (name.includes("4공장") || name === "4") return "4공장";
           if (name.includes("5공장") || name === "5") return "5공장";
           if (name.includes("엔진")) return "6.엔진";
           if (name.includes("변속기")) return "7.변속기";
           if (name.includes("소재")) return "8.소재";
		   if (name.includes("기타")) return "9.기타";
           if (name.includes("아산")) return "10.아산";
           if (name.includes("남양")) return "11.남양";
           if (name.includes("광명")) return "12.광명";

       };

       // (v2.24) 기상특보 심각도: 중대경보 > 경보 > 주의보 순으로 정렬 + 배지 색 구분
       const warningSeverity = (w) => {
           if (w.endsWith("중대경보")) return 3;
           if (w.endsWith("경보")) return 2;
           if (w.endsWith("주의보")) return 1;
           return 0;
       };
       const sortWarnings = (list) => [...list].sort((a, b) => warningSeverity(b) - warningSeverity(a));
       const warningBadgeClass = (w) => {
           const sev = warningSeverity(w);
           if (sev === 3) return "bg-red-700 text-white ring-2 ring-red-300 animate-pulse"; // 중대경보: 가장 위급
           if (sev === 2) return "bg-rose-500 text-white"; // 경보
           return "bg-amber-500 text-white"; // 주의보
       };


       function App() {

           const [showHelp, setShowHelp] = useState(false);

           // (v2.17) 접힌 카드 중 사용자가 수동으로 펼친 것들 (06시 넘기면 초기화 — 아래 workday 정의 후 effect)

           // 체감온도(열지수) 계산기
           const [heatTemp, setHeatTemp] = useState("");

           // ── 구글 시트 체감온도 자동 기록 ──────────────
           const sendHeatToSheet = async (item, entry) => {
               const cfg = window.APP_CONFIG || {};
               if (!cfg.sheetsWebhookUrl) return; // URL 미설정 시 무시
               try {
                   await fetch(cfg.sheetsWebhookUrl, {

                       body: JSON.stringify({
