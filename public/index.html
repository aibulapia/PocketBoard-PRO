                           company: item.company || item.location || "",
                           title: item.title || "",
                           grade: item.grade || "",
                           workType: item.workType || "",
                           value: entry.value,
                           level: entry.level,
                           temp: entry.temp,
                           humidity: entry.humidity,
                       }),
                   });
               } catch (e) {
                   console.warn("시트 기록 실패:", e);
               }
           };

           // 안전보건공단/기상청 공식 체감온도 (2022.6.2 개정 산출식)
           // Tw: 습구온도 (Stull 추정식), Ta: 기온, RH: 상대습도
           // (v2.22) 대상 카드를 지정해 계산 — 바텀시트(selectedItem)와 카드 목록 양쪽에서 재사용
           const calcHeatFor = (targetItem, tempStr, humStr, onDone) => {
               const Ta = parseFloat(tempStr);
               const RH = parseFloat(humStr);
               if (isNaN(Ta) || isNaN(RH)) {
                   showToast("기온과 습도를 입력해주세요.");
                   return;
               }
               // Stull(2011) 습구온도 추정식
               const Tw = Ta * Math.atan(0.151977 * Math.pow(RH + 8.313659, 0.5))
                   + Math.atan(Ta + RH)
                   - Math.atan(RH - 1.67633)
                   + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH)
                   - 4.686035;
               // 기상청 2022 개정 체감온도 공식
               const HIc = -0.2442 + 0.55399 * Tw + 0.45535 * Ta
                   - 0.0022 * Tw * Tw + 0.00278 * Tw * Ta + 3.0;
               // KOSHA 포털 색상 기준
               let level, color, guide;
               if (HIc >= 38)      { level = "위험";  color = "red";    guide = "작업 중지 권고, 즉시 대피"; }
               else if (HIc >= 35) { level = "경고";  color = "orange"; guide = "매시간 15분 휴식 권고"; }
               else if (HIc >= 33) { level = "주의";  color = "yellow"; guide = "2시간 작업 시 20분 휴식"; }
               else if (HIc >= 31) { level = "관심";  color = "sky";    guide = "충분한 물 섭취, 주기적 휴식"; }
               else                { level = "보통";  color = "slate";  guide = "쾌적한 작업 환경"; }

               const entry = {
                   temp: Ta, humidity: RH,
                   value: HIc.toFixed(1),               // 소수점 1자리 통일
                   level, color, guide,
                   workday: getWorkdayKey(),            // 06시 체계 일자
                   hm: nowHm(),                          // 24시간제 HH:MM
                   time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
               };
               if (targetItem) {
                   const updatedItems = items.map(it =>
                       it.id === targetItem.id
                           ? { ...it, lastHeatStatus: entry, heatResults: [entry, ...(it.heatResults || [])] }
                           : it
                   );
                   persistItems(updatedItems);
                   sendHeatToSheet(targetItem, entry);
               }
               if (onDone) onDone(entry);
               return entry;
           };

           const calcHeatIndex = () => {
               calcHeatFor(selectedItem, heatTemp, heatHumidity, (entry) => {
                   setHeatResults(prev => [entry, ...prev]);
                   setCurrentHeatStatus(entry);
               });
           };

           // 긴급공사 직접 입력 모달 상태 관리 (5단계 프로세스용)
           const [showAddModal, setShowAddModal] = useState(false);
           const [addModalTab, setAddModalTab] = useState("extra"); // "extra" | "urgent"
           const [selectedExtras, setSelectedExtras] = useState([]);
           const [urgentFactory, setUrgentFactory] = useState("1공장");
           const [urgentSubFactory, setUrgentSubFactory] = useState("");
           const [urgentWorkLocation, setUrgentWorkLocation] = useState("");
           const [urgentWorkContent, setUrgentWorkContent] = useState("");
           const [urgentWorkTypes, setUrgentWorkTypes] = useState([]);
           const [urgentSupervisor, setUrgentSupervisor] = useState("");

           const WORK_TYPE_OPTIONS = D.WORK_TYPE_OPTIONS || ["고소", "중량물", "화기", "밀폐", "건설기계", "전기", "자동화", "청소", "운반", "도색"];

           // ── 분 단위 틱: 06시 넘김/17시 전환 자동 감지용 리렌더 ──
           const [nowTick, setNowTick] = useState(() => new Date());
           useEffect(() => {
               const t = setInterval(() => setNowTick(new Date()), 60 * 1000);
               return () => clearInterval(t);
           }, []);
           const workday = getWorkdayKey(nowTick);
           const todayDow = getWorkdayDow(nowTick);
           // (v2.17) 06시 넘겨 workday가 바뀌면 수동 펼침 상태 초기화
           useEffect(() => { setExpandedIds([]); }, [workday]);
           // (v2.18) 06시 리셋 시 '내 공사' 북마크도 자동 해제
           useEffect(() => {
               try {
                   const raw = JSON.parse(localStorage.getItem("MMEEC_BOOKMARK") || "null");
                   if (raw && raw.workday !== workday) {
                       localStorage.removeItem("MMEEC_BOOKMARK");
                       setBookmarkId(null);
                   }
               } catch {}
           }, [workday]);
           const after17 = isAfter17(nowTick);
           // (27번) 오늘 실제 날짜 라벨 "M/D(요일)" — 06시 workday 아닌 실제 달력 기준
           const todayLabel = (() => {
               const d = nowTick || new Date();
               const dows = ["일", "월", "화", "수", "목", "금", "토"];
               return `${d.getMonth() + 1}/${d.getDate()}(${dows[d.getDay()]})`;
           })();

           // (v2.14) 임의 날짜 공사 목록 조회 — ◀ 날짜 ▶ 네비게이션
           // dateOffset: 0=오늘, +N=N일 후, -N=N일 전
           const [dateOffset, setDateOffset] = useState(0);
           const selectedDate = useMemo(() => {
               const d = new Date(nowTick || new Date());
               d.setDate(d.getDate() + dateOffset);
               return d;
           }, [nowTick, dateOffset]);
           const selectedDateLabel = (() => {
               const dows = ["일", "월", "화", "수", "목", "금", "토"];
               return `${selectedDate.getMonth() + 1}/${selectedDate.getDate()}(${dows[selectedDate.getDay()]})`;
           })();
           // 06시 넘어가 workday가 바뀌면 날짜 선택을 오늘로 자동 복귀
           useEffect(() => { setDateOffset(0); }, [workday]);

           // (7번 개선) TODAY = 수동 ON 모델
           //  기본: 모든 카드 회색(비활성). 사용자가 터치한 날만 파랑(활성).
           //  todayOn === 현재 workday 이면 활성.
           const isTodayActive = (item) => item.todayOn === workday;
           // (v2.17) 공사중 = checked & 종료 아님(17시 전 이거나 17시 이후라도 연장 있음)
           const isOngoingItem = (i) => i.status === "checked" && (!after17 || i.extendHour != null);
           // (v2.17) 카드 펼침 기준 = 탭 카운트 기준과 동일 (TODAY 활성 ∪ 공사중)
           //  → 탭 숫자에 잡히는 공사 = 목록에서 펼쳐진 공사
           const isCardOpen = (i) => isTodayActive(i) || isOngoingItem(i);
           // (25번) 오늘 인원이 배정된 공사만 TODAY 배지 노출
           // (v2.19 버그수정) 기존엔 요일(dow)만 봐서, 7월에 8월 공사표의 같은 요일 인원이
           //  잡히며 오늘 작업이 없는데도 배지가 뜨는 문제가 있었다. 실제 날짜로 대조한다.
           const hasWorkToday = (item) => workersOn(item.dateWorkers, getWorkdayDate()) > 0;
           // 선택한 날짜 기준 배정 여부 (날짜 네비게이터로 다른 날을 볼 때 사용)
           const hasWorkOn = (item, d) => workersOn(item.dateWorkers, d) > 0;
           // n일째(8번): 과거 확정 작업일 + 오늘 활성이면 +1
           const workDayCount = (item) => (item.pastWorkDays || 0) + (isTodayActive(item) ? 1 : 0);

           // ── 일일 사이클 엔진 (10번): 06시 리셋 + 8번 카운트 확정 ──
           const applyDailyCycle = (list) => {
               const wd = getWorkdayKey();
               let changed = false;
               let out = list.map(raw => {
                   let it = raw;
                   const mut = () => { if (it === raw) { it = { ...raw }; changed = true; } };
                   // (8번) 전일 활성 마크 → 작업일 확정 +1
                   if (it.activeMark && it.activeMark !== wd) {
                       mut();
                       it.pastWorkDays = (it.pastWorkDays || 0) + 1;
                       it.activeMark = null;
                   }
                   // (10번) 날짜 넘어가면 상태·연장·TODAY 리셋 (데이터는 보존)
                   if (it.dayKey !== wd) {
                       mut();
                       it.dayKey = wd;
                       if (it.status === "checked") it.status = "pending"; // 공사중 → 재확인
                       if (it.extendHour != null) it.extendHour = null;    // 연장 초기화
                       if (it.todayOn && it.todayOn !== wd) it.todayOn = null; // TODAY 자동 리셋(06시)
                   }
                   // (v2.22c) 체감온도 기록 1일 단위 리셋 — 06시 넘어가면 전날 기록 삭제.
                   //  누적 시 서버 저장 한도(items 1MB)를 넘겨 그날 점검 기록 자체가
                   //  저장되지 않는 문제가 있어, 당일치만 남긴다.
                   //  (원본 보존이 필요하면 05시 구글시트 자동백업을 사용)
                   const heats = it.heatResults;
                   if (Array.isArray(heats) && heats.length) {
                       // workday 없는 구버전 기록은 화면 표시 로직과 동일하게 당일 것으로 간주해 보존
                       const todayOnly = heats.filter(r => r && (!r.workday || r.workday === wd));
                       if (todayOnly.length !== heats.length) {
                           mut();
                           it.heatResults = todayOnly;
                           // 마지막 측정값도 당일 것이 아니면 함께 정리
                           if (it.lastHeatStatus && it.lastHeatStatus.workday && it.lastHeatStatus.workday !== wd) it.lastHeatStatus = null;
                       }
                   }
                   // (8번) 오늘 활성(수동 ON) 상태를 마크에 반영
                   const active = it.todayOn === wd;
                   if (active && it.activeMark !== wd) { mut(); it.activeMark = wd; }
                   if (!active && it.activeMark === wd) { mut(); it.activeMark = null; }
                   return it;
               });
               // (19번) 공사 최종일이 지난 카드 완전 제거 (endDate < 오늘 workday).
               //  endDate 없는 구버전 카드는 안전하게 보존(제거 대상 제외).
               const before = out.length;
               out = out.filter(it => !(it.endDate && it.endDate < wd));
               if (out.length !== before) changed = true;
               return { list: changed ? out : list, changed };
           };

           // 로드/틱 시 사이클 적용
           useEffect(() => {
               if (isLoading || items.length === 0) return;
               const { list, changed } = applyDailyCycle(items);
               if (changed) persistItems(list);
           }, [isLoading, workday, items.length]);

           // (7번) TODAY 배지 터치 토글 — 회색 ↔ 파랑
           const toggleTodayOff = (item, e) => {
               if (e) e.stopPropagation();
               const wd = getWorkdayKey();
               const updated = items.map(it => {
                   if (it.id !== item.id) return it;
                   const on = it.todayOn === wd ? null : wd;
                   return { ...it, todayOn: on, activeMark: on ? wd : null };
               });
               persistItems(updated);
           };

           const toggleUrgentWorkType = (type) => {
               setUrgentWorkTypes(prev =>
                   prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]
               );
           };

           const handleAddUrgent = () => {
               if (!urgentFactory) { showToast("공장을 선택해주세요."); return; }
               const availableSubFactories = SUB_FACTORIES[urgentFactory] || [];
               if (availableSubFactories.length > 0 && !urgentSubFactory) { showToast("하위 공장을 선택해주세요."); return; }
               if (!urgentWorkLocation.trim()) { showToast("작업 위치를 입력해주세요."); return; }
               if (!urgentWorkContent.trim()) { showToast("작업 내용을 입력해주세요."); return; }
               if (!urgentSupervisor.trim()) { showToast("담당 감독자를 입력해주세요."); return; }

               // 자동 완성 데이터 조합 (빈칸은 정규식으로 다듬어 단일 공백 처리)
               const generatedTitle = `${urgentFactory} ${urgentSubFactory} ${urgentWorkLocation.trim()} ${urgentWorkContent.trim()}`.replace(/\s+/g, ' ').trim();
               const generatedLocation = `${urgentSubFactory} ${urgentWorkLocation.trim()}`.trim();

               const newItem = {
                   id: `urgent-${Date.now()}`,
                   no: `긴급`,
                   factory: urgentFactory,
                   rawFactory: urgentFactory,
                   location: generatedLocation,
                   title: generatedTitle,
                   company: "긴급공사",
                   supervisor: urgentSupervisor.trim(),
                   assignedSupervisor: urgentSupervisor.trim(),
                   spotLocation: generatedLocation,
                   status: "pending",
                   grade: "긴급",
                   workType: urgentWorkTypes.length > 0 ? urgentWorkTypes.join("+") : "일반",
                   memo: "",
                   isUrgent: true
               };

               const updatedItems = [...items, newItem];
               persistItems(updatedItems);
               setShowAddModal(false);
 
               // 모달 닫기 시 상태 초기화
               setUrgentFactory("1공장"); 
               setUrgentSubFactory("");
               setUrgentWorkLocation(""); 
               setUrgentWorkContent("");
               setUrgentSupervisor("");
               setUrgentWorkTypes([]);
               showToast("⚡ 긴급공사가 추가되었습니다.");
           };

           const showToast = (message) => {
               setToast(message);
               setTimeout(() => setToast(null), 2500);
           };

           const persistItems = async (newItems, metaOverride) => {
               setItems(newItems);
               setSyncStatus("saving");
               const meta = metaOverride || { sheetTitle: sheetTitle || null };
               try {
                   const result = await MMEECStorage.save(newItems, meta);
                   setSyncStatus(result.mode === "cloud" ? "saved" : "local");
               } catch (e) {
                   console.error(e);
                   setSyncStatus("error");
                   showToast("저장 실패 — 네트워크 확인 후 다시 시도");
               }
           };

           useEffect(() => {
               let mounted = true;
               (async () => {
                   setIsLoading(true);
                   try {
                       const data = await MMEECStorage.load();
                       if (!mounted) return;
                       setItems(data.items || []);
                       // 진단 로그 (문제 발생 시 개발자도구 확인용)
                       console.log("[포켓보드 v" + APP_VERSION + "] 로드:", (data.items||[]).length + "건",
                           "| workday:", getWorkdayKey(), "| dow:", getWorkdayDow(),
                           "| data.js:", Object.keys(window.APP_DATA||{}).length > 0 ? "OK" : "누락!");
                       setSessionId(data.sessionId);
                       if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                       setSyncStatus(MMEECStorage.isCloudEnabled() ? "saved" : "local");
                   } catch (e) {
                       console.error(e);
                       showToast("데이터 불러오기 실패");
                   } finally {
                       if (mounted) setIsLoading(false);
                   }
               })();
               return () => { mounted = false; };
           }, []);

           // ── Realtime 구독 (세션 코드 변경 시 자동 재구독) ──────
           useEffect(() => {
               if (!MMEECStorage.isCloudEnabled()) return;
               const socket = MMEECStorage.subscribeRealtime(sessionId, async () => {
                   try {
                       const data = await MMEECStorage.load();
                       setItems(data.items || []);
                       if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                       showToast("📡 데이터가 자동으로 업데이트되었습니다.");
                   } catch (e) {
                       console.warn("Realtime 업데이트 실패:", e);
                   }
               });
               return () => { if (socket) socket.close(); };
           }, [sessionId]);

           const handleChangeSession = async () => {
               if (!sessionInput.trim()) { showToast("공사 코드를 입력해주세요."); return; }
               MMEECStorage.setSessionId(sessionInput.trim());
               setSessionId(sessionInput.trim());
               setShowSessionModal(false);
               setIsLoading(true);
               try {
                   const data = await MMEECStorage.load();
                   setItems(data.items || []);
                   if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                   showToast(`공사 코드 [${sessionInput.trim()}] 로드 완료`);
               } catch (e) {
                   showToast("공사 코드 데이터 불러오기 실패");
               } finally {
                   setIsLoading(false);
               }
           };

           const syncLabel = {
               idle: "준비",
               saving: "저장 중…",
               saved: "☁️ 저장됨",
               local: "📱 기기 저장",
               error: "⚠️ 저장 실패"
           }[syncStatus] || "";

           // SheetJS 활용 엑셀/CSV 파일 파싱
           const handleFileUpload = (e) => {
               const file = e.target.files[0];
               if (!file) return;

               const reader = new FileReader();
               reader.onload = (evt) => {
                   const data = new Uint8Array(evt.target.result);
                   const workbook = XLSX.read(data, { type: 'array' });
                   const firstSheetName = workbook.SheetNames[0];
                   const worksheet = workbook.Sheets[firstSheetName];
 
                   const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
 
                   // 헤더 셀 공백/병합셀 잔여 문자 제거 후 비교
                   const normCell = (c) => String(c ?? "").replace(/\s/g, "");
                   let headerRowIndex = -1;
                   for (let i = 0; i < rows.length; i++) {
                       if (!rows[i]) continue;
                       const normed = rows[i].map(normCell);
                       if (normed.includes("NO") && normed.includes("공장")) {
                           headerRowIndex = i;
                           break;
                       }
                   }

                   if (headerRowIndex === -1) {
                       // 디버깅: 실제 읽힌 상위 10행을 콘솔에 출력해 원인 파악 지원
                       console.warn("[엑셀 파싱 실패] 상위 10행 원본:", rows.slice(0, 10));
                       showToast("올바른 공사 양식 행(NO, 공장...)을 찾을 수 없습니다. (개발자도구 콘솔 참고)");
                       return;
                   }

                   const headers = rows[headerRowIndex].map(c => String(c ?? "").trim());
                   const noIdx = headers.indexOf("NO");
                   const factoryIdx = headers.indexOf("공장");
                   const bizIdx = headers.indexOf("사업장");
                   const locIdx = headers.indexOf("세부위치");
                   const nameIdx = headers.indexOf("공사명");
                   const gradeIdx = headers.indexOf("등급");
                   const workIdx = headers.indexOf("작업");
                   const supervisorIdx = headers.indexOf("감독");

                   // 날짜 컬럼 파싱: 헤더 행 또는 바로 다음 행에 "17(금),18(토),19(일)" 존재
                   const dateColMap = {}; // { colIdx: { day, dow, month } }  dow: 0=일,6=토
                   const dowMap = { 일: 0, 월: 1, 화: 2, 수: 3, 목: 4, 금: 5, 토: 6 };
                   // (v2.19) 제목행에서 공사 기간의 월을 추출 (예: "26하계공사8/1~8/9)" → 8)
                   let sheetMonth = null;
                   for (let r = 0; r < Math.min(rows.length, headerRowIndex + 1); r++) {
                       const line = (rows[r] || []).map(c => (c == null ? "" : String(c))).join(" ");
                       const mm = line.match(/(\d{1,2})\s*[\/월]\s*\d{1,2}/);
                       if (mm) { const v = Number(mm[1]); if (v >= 1 && v <= 12) { sheetMonth = v; break; } }
                   }
                   const scanDateRow = (rowArr) => {
                       if (!rowArr) return;
                       // 같은 행에서 날짜가 감소하면 달이 넘어간 것으로 본다 (예: 30,31,1,2 → 뒤쪽은 다음 달)
                       let curMonth = sheetMonth, prevDay = 0;
                       rowArr.forEach((h, i) => {
                           if (h == null) return;
                           const s = String(h).trim();
                           const dowChar = (s.match(/[월화수목금토일]/) || [])[0];
                           const dayNum = (s.match(/(\d{1,2})/) || [])[1];
                           if (dowChar && dowMap[dowChar] !== undefined && dateColMap[i] === undefined) {
                               const d = dayNum ? Number(dayNum) : 0;
                               if (curMonth != null && d > 0 && prevDay > 0 && d < prevDay) {
                                   curMonth = curMonth === 12 ? 1 : curMonth + 1;
                               }
                               if (d > 0) prevDay = d;
                               dateColMap[i] = { day: d, dow: dowMap[dowChar], month: curMonth };
                           }
                       });
                   };
                   scanDateRow(rows[headerRowIndex]);       // 헤더 행 자체
                   scanDateRow(rows[headerRowIndex + 1]);    // 헤더 바로 다음 행 (실제 양식)
                   // 날짜 행이 헤더 다음 행이면, 데이터는 그 다음부터 시작
                   const dateRowIsNext = Object.keys(dateColMap).length > 0 &&
                       Object.keys(dateColMap).some(ci => {
                           const cell = rows[headerRowIndex + 1]?.[ci];
                           return cell != null && /[월화수목금토일]/.test(String(cell));
                       });
                   const dataStartIndex = dateRowIsNext ? headerRowIndex + 2 : headerRowIndex + 1;
                   console.log("[엑셀] 헤더행:", headerRowIndex, "| 날짜컬럼:", dateColMap, "| 데이터시작:", dataStartIndex);

                   // (v2.19b) 배너 제목 감지 — 우선순위: ①"월"+"주" 둘 다 포함된 줄 ②날짜패턴만 있는 줄 ③시트 이름.
                   //  내용은 다듬지 않고 원본 그대로 사용한다. ①인데 날짜가 없으면 실제 날짜 컬럼에서 계산해 뒤에 붙인다.
                   const dateRangePattern = /\d{1,2}\s*\/\s*\d{1,2}\s*[~\-]\s*\d{1,2}\s*\/\s*\d{1,2}/;
                   const monthWeekRow = rows.find(r => r && r[0] && String(r[0]).includes("월") && String(r[0]).includes("주"));
                   const dateOnlyRow = rows.find(r => r && r[0] && dateRangePattern.test(String(r[0])));
                   let detectedTitle;
                   if (monthWeekRow) {
                       const raw = String(monthWeekRow[0]).trim();
                       if (dateRangePattern.test(raw)) {
                           detectedTitle = raw;   // 이미 날짜가 있으면 원본 그대로
                       } else {
                           // 날짜가 없으면 실제 작업인원 셀(dateColMap)에서 시작~종료일을 계산해 뒤에 붙인다
                           const entries = Object.values(dateColMap);
                           if (entries.length) {
                               const base = entries[0].month;
                               const val = (e) => e.day + ((e.month - base + (e.month < base ? 12 : 0)) * 31);
                               const first = entries.reduce((a, b) => val(a) <= val(b) ? a : b);
                               const last = entries.reduce((a, b) => val(a) >= val(b) ? a : b);
                               detectedTitle = `${raw} ${first.month}/${first.day}~${last.month}/${last.day}`;
                           } else {
                               detectedTitle = raw;
                           }
                       }
                   } else if (dateOnlyRow) {
                       detectedTitle = String(dateOnlyRow[0]).trim();
                   } else {
                       detectedTitle = firstSheetName;
                   }

                   const parsedList = [];
                   for (let i = dataStartIndex; i < rows.length; i++) {
                       const row = rows[i];
                       if (!row || row.length === 0 || !row[noIdx]) continue;

                       const rawFactory = row[factoryIdx] || "";
                       const normalizedFactory = normalizeFactoryName(rawFactory);
                       const rawSupervisor = row[supervisorIdx] || "";

                       // 날짜별 투입 인원 수집
                       // (v2.19) 같은 요일이 두 번 이상 나오면(9일 이상 기간) 키를 +7씩 밀어 덮어쓰기를 막는다.
                       const dateWorkers = {};
                       Object.entries(dateColMap).forEach(([ci, info]) => {
                           const val = Number(row[ci] || 0);
                           let slot = info.dow;
                           while (dateWorkers[slot] !== undefined) slot += 7;
                           dateWorkers[slot] = { day: info.day, workers: val, month: info.month ?? null };
                       });

                       // (8번) 소급 초기값: 오늘(06시 체계) 이전 날짜에 인원>0이면 이미 진행된 작업일로 카운트
                       // (v2.25) 월경계 버그 수정 — 기존엔 day(일자)만 비교해서 예를 들어 "오늘 8/3, 과거기록 7/28"
                       //  같은 경우 28 < 3 이 거짓이 되어 놓쳤음. month까지 포함해 실제 날짜 차이를 계산하도록 변경.
                       const wdDateForInit = getWorkdayDate();
                       const curDay = wdDateForInit.getDate();
                       const curMonth = wdDateForInit.getMonth() + 1;
                       let initialPast = 0;
                       Object.values(dateWorkers).forEach(dw => {
                           if (dw.workers <= 0) return;
                           const dwMonth = dw.month ?? curMonth;
                           // 월차이*31(안전마진) + 일차이로 절대적인 "며칠 전"을 계산 (연도 넘어가는 12월→1월도 처리)
                           const diffDays = (curMonth - dwMonth + (curMonth < dwMonth ? 12 : 0)) * 31 + (curDay - dw.day);
                           if (diffDays > 0 && diffDays <= 7) initialPast++;
                       });

                       parsedList.push({
                           id: `mmeec-${row[noIdx]}-${normalizedFactory}-${String(row[nameIdx] || "").slice(0, 20)}`,
                           no: row[noIdx],
                           factory: normalizedFactory,
                           rawFactory: rawFactory,
                           location: row[locIdx] || "",
                           title: row[nameIdx] || "",
                           company: row[bizIdx] || "미지정 업체",
                           supervisor: rawSupervisor,
                           assignedSupervisor: rawSupervisor,
                           spotLocation: "",
                           status: "pending",
                           grade: row[gradeIdx] || "B",
                           workType: row[workIdx] || "",
                           memo: "",
                           dateWorkers, // { 6: {day:11,workers:5}, 0: {day:12,workers:3} }
                           endDate: computeEndDate(dateWorkers),  // (19번) 공사 최종일 (YYYY-MM-DD)
                           pastWorkDays: initialPast,   // (8번) 엑셀 소급 초기값
                           dayKey: getWorkdayKey(),
                       });
                   }

                   if (parsedList.length > 0) {
                       const merged = MMEECStorage.mergeItems(items, parsedList);
                       const cycled = applyDailyCycle(merged).list;
                       setSheetTitle(detectedTitle);
                       persistItems(cycled, { sheetTitle: detectedTitle });
                       setActiveTab("전체");
                       const noDateCol = Object.keys(dateColMap).length === 0;
                       showToast(noDateCol
                           ? `총 ${parsedList.length}건 업로드 — ⚠️ 요일 컬럼을 못 찾아 TODAY 표시가 안 됩니다`
                           : `총 ${parsedList.length}건 업로드 (기존 입력 유지)`);
                   } else {
                       showToast("추출된 공사 데이터가 없습니다.");
                   }
               };
               reader.readAsArrayBuffer(file);
           };

           // (구 todayDow / isTodayItem 로직은 상단 06시 체계 유틸로 대체됨)

           // 당일 미포함 공사 (공사 추가 탭용) - 오늘(06시 체계) 실제 날짜 기준
           const extraItems = useMemo(() => {
               return items.filter(item => !item.isUrgent && !hasWorkToday(item));
           }, [items, nowTick]);

           const toggleExtraSelect = (id) => {
               setSelectedExtras(prev =>
                   prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
               );
           };

           // (v2.19) 오늘 인원 1명 배정을 dateWorkers에 기록.
           //  구버전은 {day:0} 으로 넣어 날짜 대조가 불가능했으므로 실제 날짜·월을 함께 저장한다.
           const withTodayAssigned = (item) => {
               const d = getWorkdayDate();
               const dw = { ...(item.dateWorkers || {}) };
               const existing = findDayWorkers(dw, d);
               if (existing) { existing.workers = Math.max(1, Number(existing.workers) || 0); return dw; }
               let slot = d.getDay();
               while (dw[slot] !== undefined) slot += 7;
               dw[slot] = { day: d.getDate(), month: d.getMonth() + 1, workers: 1 };
               return dw;
           };

           const addExtraItems = () => {
               const toAdd = items.map(item =>
                   selectedExtras.includes(item.id)
                       ? { ...item, dateWorkers: withTodayAssigned(item) }
                       : item
               );
               persistItems(toAdd);
               setSelectedExtras([]);
               setShowAddModal(false);
               showToast(`${selectedExtras.length}건이 오늘 목록에 추가됐습니다.`);
           };

           const activeFactories = useMemo(() => {
               const set = new Set(items.map(item => item.factory));
               const inData = SUPPORTED_FACTORIES.filter(f => set.has(f));
               // myFactories가 설정된 경우 해당 공장만 표시
               const filtered = myFactories
                   ? inData.filter(f => myFactories.includes(f))
                   : inData;
               return ["전체", ...filtered];
           }, [items, myFactories]);

           // (v2.17) 카드 목록 좌우 스와이프로 공장 탭 순환 이동 (전체 포함)
           const touchStart = useRef(null);
           const onListTouchStart = (e) => {
               const t = e.touches && e.touches[0];
               touchStart.current = t ? { x: t.clientX, y: t.clientY } : null;
           };
           const onListTouchEnd = (e) => {
               const s = touchStart.current;
               touchStart.current = null;
               if (!s || activeFactories.length < 2) return;
               const t = e.changedTouches && e.changedTouches[0];
               if (!t) return;
               const dx = t.clientX - s.x;
               const dy = t.clientY - s.y;
               // 가로 이동이 충분히 크고, 세로 스크롤보다 우세할 때만 탭 이동
               if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
               const idx = activeFactories.indexOf(activeTab);
               if (idx === -1) return;
               const len = activeFactories.length;
               const next = dx < 0 ? (idx + 1) % len : (idx - 1 + len) % len;
               setActiveTab(activeFactories[next]);
               // (v2.22b) 넘긴 방향으로 목록이 미끄러지는 느낌을 준다
               setSlideDir(dx < 0 ? "left" : "right");
           };

           // (v2.22b) 카드 목록 좌우 스와이프 시 넘긴 방향으로 미끄러지는 애니메이션
           const [slideDir, setSlideDir] = useState(null);
           useEffect(() => {
               if (!slideDir) return;
               const t = setTimeout(() => setSlideDir(null), 260);
               return () => clearTimeout(t);
           }, [slideDir, activeTab]);
           // (v2.22b) 선택된 공장 탭이 항상 화면 안에 보이도록 자동 스크롤
           const tabRefs = useRef({});
           useEffect(() => {
               const el = tabRefs.current[activeTab];
               if (el && el.scrollIntoView) {
                   try { el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" }); } catch {}
               }
           }, [activeTab]);

           // (v2.22d) 카드 목록은 탭(공장) 필터만 적용해 전체를 표시하고,
           //  날짜 배정 여부는 카드의 TODAY/날짜 배지로만 구분한다.
           //  (v2.19 방식대로 '오늘 아니면 숨김'으로 걸러버리면 전체 목록을 볼 수 없었음)
           const filteredItems = useMemo(() => {
               return activeTab === "전체" ? items : items.filter(item => item.factory === activeTab);
           }, [items, activeTab]);

           // 날짜 옆 "예정 공사 N건" 문구 전용 — 선택한 날짜에 실제 배정된 건수
           //  (목록 표시와는 별개. 진행 중인 공사는 배정이 없어도 카운트에 포함해
           //   '오늘 할 일이 몇 건인지'가 실제 현장 상황과 맞도록 한다)
           const scheduledCount = useMemo(() => {
               const viewingToday = dateOffset === 0;
               return filteredItems.filter(item =>
                   hasWorkOn(item, selectedDate) || (viewingToday && isOngoingItem(item))
               ).length;
           }, [filteredItems, dateOffset, selectedDate, after17]);

           const getSupervisorPool = (factoryName) => {
               const fixed = FIXED_SUPERVISORS[factoryName] || [];
               const dynamicallyAssigned = items
                   .filter(item => item.factory === factoryName && item.assignedSupervisor)
                   .map(item => item.assignedSupervisor.trim());
               return Array.from(new Set([...fixed, ...dynamicallyAssigned])).filter(Boolean);
           };

           // (v2.18) '내 공사' 북마크 — 1개만, 06시 리셋 시 자동 해제, 기기 로컬 저장
           const [bookmarkId, setBookmarkId] = useState(() => {
               try {
                   const raw = JSON.parse(localStorage.getItem("MMEEC_BOOKMARK") || "null");
                   return raw && raw.workday === getWorkdayKey() ? raw.id : null;
               } catch { return null; }
           });
           const toggleBookmark = () => {
               if (!selectedItem) return;
               const next = bookmarkId === selectedItem.id ? null : selectedItem.id;
               setBookmarkId(next);
               if (next) {
                   localStorage.setItem("MMEEC_BOOKMARK", JSON.stringify({ id: next, workday: getWorkdayKey() }));
                   showToast("즐겨찾기로 저장했습니다. 앱을 다시 열면 바로 표시됩니다.");
               } else {
                   localStorage.removeItem("MMEEC_BOOKMARK");
                   showToast("즐겨찾기 저장을 해제했습니다.");
               }
           };

           // (v2.22) 카드 목록에서 바로 쓰는 체감온도 입력 / 안전보고문 단계 선택
           //  · 바텀시트를 열지 않고 카드를 펼친 자리에서 처리하기 위한 카드별 임시 상태
           //  · cardStage 는 보고문 문구용 선택일 뿐, 카드 실제 status 는 바꾸지 않는다
           const [cardHeatOpen, setCardHeatOpen] = useState(null);   // 체감온도 입력창 열린 카드 id
           const [cardTemp, setCardTemp] = useState("");
           const [cardHum, setCardHum] = useState("");
           const [cardStage, setCardStage] = useState({});           // { [itemId]: "전" | "중" | "후" }
           const STAGE_SEQ = ["전", "중", "후"];
           const stageLabel = (s) => (s === "후" ? "종료" : `공사${s}`);
           // 카드 실제 상태로부터 기본 단계 산출 (사용자가 화살표로 바꾸기 전까지의 초기값)
           const defaultStageOf = (item) => {
               if (item.status !== "checked") return "전";
               return (after17 && item.extendHour == null) ? "후" : "중";
           };
           const stageOf = (item) => cardStage[item.id] || defaultStageOf(item);
           const moveStage = (item, dir) => {
               const cur = STAGE_SEQ.indexOf(stageOf(item));
               const next = (cur + dir + STAGE_SEQ.length) % STAGE_SEQ.length;
               setCardStage(prev => ({ ...prev, [item.id]: STAGE_SEQ[next] }));
           };

           const openBottomSheet = (item) => {
               setSelectedItem(item);
               setSpotLocation(item.spotLocation || "");
               setAssignedSupervisor(item.assignedSupervisor || "");
               setMemo(item.memo || "");
               setDirectWorkers(item.directWorkers || "");
               setDailyWorkers(item.dailyWorkers || "");
               setPartnerName(item.partnerName || "");
               setPartnerWorkers(item.partnerWorkers || "");
               setReportStage(item.reportStage || "전");
               setHasElderly(item.hasElderly || false);
               setElderlyCount(item.elderlyCount || 1);
               setHeatTemp("");
               setHeatHumidity("");
               // (10번) 화면에는 오늘(06시 체계) 기록만 — 과거 데이터는 보존
               const wd = getWorkdayKey();
               setHeatResults((item.heatResults || []).filter(r => !r.workday || r.workday === wd));
               setExtendHour(item.extendHour ?? null);
           };

           // (v2.18) 앱 시작(로딩 완료) 시 북마크한 공사의 입력 시트를 자동으로 연다. 세션당 1회만.
           const bookmarkOpened = useRef(false);
           useEffect(() => {
               if (isLoading || bookmarkOpened.current || !bookmarkId) return;
               const target = items.find(i => i.id === bookmarkId);
               bookmarkOpened.current = true;
               if (target) openBottomSheet(target);   // 없으면(만료·삭제) 조용히 무시
           }, [isLoading, items, bookmarkId]);

           // 인원수 입력값 정제: 숫자만 추출, 비숫자면 빈 문자열
           const cleanCount = (v) => {
               const n = parseInt(String(v).replace(/[^\d]/g, ""), 10);
               return isNaN(n) || n < 0 ? "" : String(n);
           };

           const handleSaveDetails = () => {
               if (!selectedItem) return;

               const isChecked = spotLocation.trim() !== "" && assignedSupervisor.trim() !== "";
               const updatedItems = items.map(item => {
                   if (item.id === selectedItem.id) {
                       return {
                           ...item,
                           spotLocation: spotLocation.trim(),
                           assignedSupervisor: assignedSupervisor.trim(),
                           ...(item.isUrgent ? { location: spotLocation.trim() } : {}),
                           memo: memo.trim(),
                           directWorkers: cleanCount(directWorkers),
                           dailyWorkers: cleanCount(dailyWorkers),
                           partnerName: partnerName.trim(),
                           partnerWorkers: cleanCount(partnerWorkers),
                           reportStage,
                           hasElderly,
                           elderlyCount: cleanCount(elderlyCount) || "1",
                           extendHour,
                           status: isChecked ? "checked" : "pending",
                           // (v2.17) 입력 저장 시 TODAY 자동 활성.
                           //  오늘 인원 배정이 없던 공사는 '당일 공사 추가'와 동일하게 1명으로 잡아준다.
                           todayOn: workday,
                           activeMark: workday,
                           dateWorkers: hasWorkToday(item) ? item.dateWorkers : withTodayAssigned(item)
                       };
                   }
                   return item;
               });

               persistItems(updatedItems);
               setSelectedItem(null);
               showToast("점검 기록이 저장되었습니다.");
           };

           // (v2.14) 카드 입력 초기화 — 공사위치/감독자/인원/메모/고령자/연장 전부 초기화 + "공사전"으로 복귀.
           //  체감온도 기록(heatResults, lastHeatStatus)은 보존한다.
           const handleCardReset = () => {
               if (!selectedItem) return;
               const updatedItems = items.map(item => {
                   if (item.id !== selectedItem.id) return item;
                   return {
                       ...item,
                       spotLocation: "",
                       assignedSupervisor: "",
                       ...(item.isUrgent ? { location: "" } : {}),
                       memo: "",
                       directWorkers: "",
                       dailyWorkers: "",
                       partnerName: "",
                       partnerWorkers: "",
                       hasElderly: false,
                       elderlyCount: "1",
                       extendHour: null,
                       status: "pending",
                       // heatResults / lastHeatStatus 는 건드리지 않음 — 보존
                   };
               });
               persistItems(updatedItems);
               setShowCardResetConfirm(false);
               setSelectedItem(null);
               showToast("입력 내용이 초기화되어 공사전 상태로 되돌아갔습니다.");
           };

           // 작업유형 안전대책/공통수칙은 data.js(APP_DATA)에서 로드됨

           // (1번) 단계별 폭염 기준 기록 찾기 — 06시 체계
           //  공사전: 그날 최초 기록 / 공사중: 12~14시 사이 최초 기록
           const findHeatRecordForStage = (item, stage) => {
               const wd = getWorkdayKey();
               const todays = (item.heatResults || [])
                   .filter(r => (!r.workday || r.workday === wd))
                   .map(r => ({ ...r, _hm: toHm24(r) }))
                   .filter(r => r._hm)
                   .sort((a, b) => a._hm.localeCompare(b._hm)); // 이른 시간 순
               if (todays.length === 0) return null;
               if (stage === "전") return todays[0];
               // 공사중: 12:00 ~ 14:00 사이 최초
               return todays.find(r => r._hm >= "12:00" && r._hm <= "14:00") || null;
           };

           const buildSafetyReport = (item, stage, elderly, elderlyCount, heatRec) => {
               const grade = (item.grade || "").trim();
               const workCode = (item.workType || "").trim();

               // 코드 추출
               //  · 긴급공사: "자동화+청소" 형태(라벨 + 구분자) → 매핑표로 변환
               //    ※ 라벨을 글자 단위로 쪼개면 "자동화"의 '화'가 화기작업으로 오인식되므로 반드시 매핑표 사용
               //  · 엑셀 공사: "고중" 형태(코드 나열) → 글자 단위 분리
               const validKeys = Object.keys(WORK_TYPE_SAFETY);
               let codes;
               if (workCode.includes("+") || WORK_TYPE_LABEL_CODE[workCode]) {
                   codes = workCode.split("+")
                       .map(label => WORK_TYPE_LABEL_CODE[label.trim()])
                       .filter(c => c && validKeys.includes(c));
               } else {
                   codes = workCode.split("").filter(c => validKeys.includes(c));
               }
               // 중복 제거 (같은 대책 반복 방지)
               codes = Array.from(new Set(codes));

               // 유형별 대표 안전대책 1개씩만
               const specificMeasures = [];
               codes.forEach(c => {
                   const entry = WORK_TYPE_SAFETY[c];
                   if (entry && entry.measures.length > 0) {
                       specificMeasures.push(entry.measures[0]);
                   }
               });

               // 공통 수칙 + 유형별 대표 1개씩
               const allMeasures = [...COMMON_MEASURES, ...specificMeasures];

               const stageLabel = stage === "전" ? "공사 전" : stage === "중" ? "공사 중" : "공사 후";
               // 작업유형: 등급만 표시
               const workTypeLine = `${grade}급`;

               // 고령자 문구
               const elderlyLine = elderly
                   ? `65세 이상 고령자 ${elderlyCount || "O"}명 / 작업 전 하지근력 및 평형성 테스트 실시`
                   : `65세 이상 작업자 없음`;

               // 작업위치: 직접 입력 우선, 없으면 사업장+세부위치
               const fallbackLocation = [item.company, item.location].filter(Boolean).join(" ");
               const location = item.spotLocation || fallbackLocation || "";

               // (1번) 폭염작업 대책 — 체감온도 수치(소수점1자리) + 단계별 조치 (31℃ 이하도 작성)
               // (v2.13) 31℃ 미만("보통") → 보고문에서만 "(관심 관리)" 한 줄, 조치문구("쾌적한 작업 환경") 생략. 카드/계산기/구글시트는 기존 유지.
               const heatLines = heatRec
                   ? (heatRec.level === "보통"
                       ? [`*폭염대책 : 체감온도 ${fmt1(heatRec.value)}℃ (관심 관리)`]
                       : [
                           `*폭염대책 : 체감온도 ${fmt1(heatRec.value)}℃ (${heatRec.level})`,
                           `  - ${heatRec.guide}`,
                         ])
                   : [];

               // (6번) 작업연장 표기
               const extendLine = (item.extendHour != null) ? [`*작업연장 : ${fmtExtend(item.extendHour)}`] : [];

               if (stage === "후") {
                   return [
                       `공사 후 안전작업 이행결과`,
                       `*업 체 명 : ${item.companyName || "MMEEC"}`,
                       `*허가번호 : 2607`,
                       `*작업위치 : ${location}`,
                       `*작업유형 : ${workTypeLine}`,
                       `*작업내용 : ${item.title || ""}`,
                       ...extendLine,
                       `*작업장 주변 정리정돈 후 작업 종료합니다.`,
                   ].join("\n");
               }

               return [
                   `공사 ${stage === "전" ? "전" : "중"} 안전작업 이행결과`,
                   `*업 체 명 : ${item.companyName || "MMEEC"}`,
                   `*허가번호 : 2607`,
                   `*작업위치 : ${location}`,
                   `*작업유형 : ${workTypeLine}`,
                   `*작업내용 : ${item.title || ""}`,
                   ...extendLine,
                   `*안전대책 :`,
                   ...allMeasures.map(m => `  - ${m}`),
                   ...heatLines,
                   `*65세이상 고령자 : ${elderlyLine}`,
                   `* TBM 실시 후 작업 시작합니다.`,
               ].join("\n");
           };

           // (1번) 체감온도 미측정 경고 팝업 상태
           const [heatWarn, setHeatWarn] = useState(null); // 문자열 메시지

           const handleSafetyReportCopy = (item, e) => {
               if (e) e.stopPropagation();
               const location = item.spotLocation || item.location || "";
               if (!location) {
                   showToast("작업위치를 입력해주세요.");
                   return;
               }
               const stage = item.reportStage || "전";
               // (1번) 공사전/공사중은 체감온도 기록 필수
               let heatRec = null;
               if (stage === "전" || stage === "중") {
                   heatRec = findHeatRecordForStage(item, stage);
                   if (!heatRec) {
                       setHeatWarn(stage === "전"
                           ? "오늘 체감온도 측정 기록이 없습니다.\n체감온도 계산기로 측정 후 다시 복사해주세요."
                           : "12시~14시 사이 체감온도 측정 기록이 없습니다.\n해당 시간대 측정 후 다시 복사해주세요.");
                       return;
                   }
               }
               const text = buildSafetyReport(item, stage, item.hasElderly || false, item.elderlyCount || 1, heatRec);
               navigator.clipboard.writeText(text).then(() => {
                   showToast("📋 안전보고문이 복사되었습니다.");
               }).catch(() => {
                   showToast("클립보드 복사에 실패했습니다.");
               });
           };

           // 카톡 전송용 축약 복사 (카드별 개별 실행)
           const handleKakaoCopy = (item, e) => {
               if (e) e.stopPropagation();

               if (!item.title || !item.spotLocation || !item.assignedSupervisor) {
                   showToast("먼저 카드를 눌러 공사위치·감독자를 입력해주세요.");
                   return;
               }

               const extendTag = item.extendHour != null ? `  ${fmtExtend(item.extendHour)}` : "";
               const line1 = item.title + extendTag;
               const line2 = `  ${item.spotLocation}  감독-${item.assignedSupervisor}`;
               const dCount = parseInt(item.directWorkers, 10) || 0;
               const wCount = parseInt(item.dailyWorkers, 10) || 0;
               const pCount = parseInt(item.partnerWorkers, 10) || 0;
               const manpowerParts = [];
               if (dCount > 0) manpowerParts.push(`직${dCount}`);
               if (wCount > 0) manpowerParts.push(`일용${wCount}`);
               if (item.partnerName && pCount > 0) manpowerParts.push(`${item.partnerName} ${pCount}`);
               const line3 = manpowerParts.join(" ");

               const text = [line1, line2, line3].filter(Boolean).join("\n");

               navigator.clipboard.writeText(text).then(() => {
                   showToast("💬 카톡용 문구가 복사되었습니다.");
               }).catch(() => {
                   showToast("클립보드 복사에 실패했습니다.");
               });
           };

           const openFactoryFilter = () => {
               setFilterDraft(myFactories ? [...myFactories] : []);
               setShowFactoryFilter(true);
           };

           // (12번) 최초/미설정 시 내 공장 설정 강제 팝업
           useEffect(() => {
               if (!myFactories || myFactories.length === 0) {
                   setFilterDraft([]);
                   setShowFactoryFilter(true);
               }
           }, []);

           // 초기 활성 탭 = 첫 번째 내 공장 (없으면 전체)
           useEffect(() => {
               if (myFactories && myFactories.length > 0) {
                   setActiveTab(myFactories[0]);
               }
           }, [isLoading]);

           // 암호 확인 후 실행
           const openPwModal = (target) => {
               setPwTarget(target);
               setPwInput("");
               setPwError(false);
               setShowPwModal(true);
           };

           const confirmPw = async () => {
               const inputHash = await sha256(pwInput);
               const expected = pwTarget === "reset" ? RESET_PW_HASH : COMPANY_PW_HASH;
               if (inputHash !== expected) {
                   setPwError(true);
                   return;
               }
               setShowPwModal(false);
               if (pwTarget === "reset") {
                   doReset();
               } else if (pwTarget === "company") {
                   setCompanyNameDraft(companyName);
                   setShowCompanyEdit(true);
               }
           };

           const toggleFilterFactory = (f) => {
               setFilterDraft(prev =>
                   prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]
               );
           };

           const saveFactoryFilter = () => {
               const sorted = SUPPORTED_FACTORIES.filter(f => filterDraft.includes(f));
               // (12번) 최소 1개 강제 — 빈 선택이면 저장/닫기 차단
               if (sorted.length === 0) {
                   showToast("내 공장을 1개 이상 선택해주세요.");
                   return;
               }
               setMyFactories(sorted);
               localStorage.setItem("MMEEC_MY_FACTORIES", JSON.stringify(sorted));
               setShowFactoryFilter(false);
               setActiveTab(sorted[0]); // 첫 번째 내 공장으로 이동
               showToast("내 공장 설정이 저장됐습니다.");
           };

           const [showCompanyEdit, setShowCompanyEdit] = useState(false);

           const saveCompanyName = () => {
               const name = companyNameDraft.trim() || "MMEEC";
               setCompanyName(name);
               localStorage.setItem("MMEEC_COMPANY_NAME", name);
               setShowCompanyEdit(false);
               showToast("회사명이 저장됐습니다.");
           };

           const doReset = async () => {
               try {
                   await MMEECStorage.clear(sessionId);
               } catch (e) {
                   console.error(e);
               }
               setItems([]);
               setSheetTitle("");
               setActiveTab("전체");
               showToast("데이터가 초기화되었습니다.");
           };

           // ═══════════════════════════════════════════════════
           // (2번) 기상 정보 — 기상청 오픈API, 2시간 캐시
           // ═══════════════════════════════════════════════════
           const [showWeather, setShowWeather] = useState(false);
           const [weather, setWeather] = useState(() => {
               try { return JSON.parse(localStorage.getItem("MMEEC_WEATHER") || "null"); } catch { return null; }
           });
           const [weatherLoading, setWeatherLoading] = useState(false);
           const [wrnExpand, setWrnExpand] = useState(false);

           const fetchWeather = async (force) => {
               const cfg = window.APP_CONFIG || {};
               if (!cfg.kmaServiceKey) { showToast("기상청 API 키가 설정되지 않았습니다."); return; }
               const TTL = 60 * 60 * 1000; // 1시간
               if (!force && weather && Date.now() - weather.ts < TTL) return;
               setWeatherLoading(true);
               const result = { ts: Date.now(), temp: null, humidity: null, warnings: [], bulletin: "", error: null,
                                wrnOk: false, wrnCheckedAt: null, wrnStale: false };
               // 직전 특보 상태 (조회 실패 시 그대로 유지하기 위한 보관용)
               const prev = weather || (() => {
                   try { return JSON.parse(localStorage.getItem("MMEEC_WEATHER") || "null"); } catch { return null; }
               })();

               // 직접 호출 실패(CORS 등) 시 Apps Script 프록시 폴백
               const getJson = async (url) => {
                   try {
                       const r = await fetch(url);
                       return await r.json();
                   } catch (e) {
                       if (!cfg.sheetsWebhookUrl) throw e;
                       const pr = await fetch(`${cfg.sheetsWebhookUrl}?proxy=${encodeURIComponent(url)}`);
                       return await pr.json();
                   }
               };

               try {
                   // ① 초단기실황: 기온(T1H)·습도(REH) — 매시 정시 관측, 40분 이후 제공
                   const now = new Date(Date.now() - 45 * 60 * 1000);
                   const bd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
                   const bt = `${String(now.getHours()).padStart(2,"0")}00`;
                   const ncstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst`
                       + `?serviceKey=${encodeURIComponent(cfg.kmaServiceKey)}&dataType=JSON&numOfRows=10&pageNo=1`
                       + `&base_date=${bd}&base_time=${bt}&nx=${cfg.kmaNx || 103}&ny=${cfg.kmaNy || 84}`;
                   const j1 = await getJson(ncstUrl);
                   const obs = j1?.response?.body?.items?.item || [];
                   obs.forEach(o => {
                       if (o.category === "T1H") result.temp = o.obsrValue;
                       if (o.category === "REH") result.humidity = o.obsrValue;
                   });
               } catch (e) { console.warn("기상 실황 조회 실패:", e); result.error = "실황"; }
               try {
                   // ② 기상특보 현황 — getPwnStatus(특보현황조회): stnId 없이 전국 현황 조회
                   //    응답 t6=특보발효현황, t7=예비특보. 우리 지역(울산) 라인만 추출.
                   const base = `https://apis.data.go.kr/1360000/WthrWrnInfoService`;
                   const key = encodeURIComponent(cfg.kmaServiceKey);
                   const areaKw = cfg.kmaAreaKeyword || "울산";
                   const statusUrl = `${base}/getPwnStatus?serviceKey=${key}&dataType=JSON&numOfRows=10&pageNo=1`;
                   let items = [];
                   try {
                       const j = await getJson(statusUrl);
                       let it = j?.response?.body?.items?.item || [];
                       if (it && !Array.isArray(it)) it = [it];
                       items = it;
                   } catch (e1) {
                       console.warn("getPwnStatus 실패:", e1);
                       throw e1;
                   }
                   // t6(특보발효현황) 내용에서 줄 단위로 우리 지역 라인만 추출
                   const t6 = items.map(m => m.t6 || "").join("\n");
                   const regionLines = t6.split("\n").filter(l => l.includes(areaKw));
                   const scope = regionLines.length ? regionLines.join(" ") : "";
                   // 특보 종류 + 등급(중대경보/경보/주의보) 추출
                   // (v2.24) 재해명을 하드코딩된 목록으로 제한하지 않고 "OO중대경보/경보/주의보" 패턴 전체를 인식
                   //         → 기상청이 새 특보명을 추가해도 코드 수정 없이 자동으로 잡힘
                   const found = scope.match(/[가-힣]{2,4}(?:중대경보|경보|주의보)/g) || [];
                   result.warnings = Array.from(new Set(found.map(s => s.replace(/\s+/g, ""))));
                   // 전문(탭 펼침용): 우리 지역 라인 우선, 없으면 t6 전체
                   result.bulletin = (regionLines.length ? regionLines.join("\n") : t6).trim().slice(0, 800);
                   // 조회 성공 → 현재 목록이 곧 유효 특보. 우리 지역이 목록에 없으면 "해제"로 보고 즉시 삭제됨.
                   result.wrnOk = true;
                   result.wrnCheckedAt = Date.now();
                   result.wrnStale = false;
               } catch (e) {
                   console.warn("기상특보 조회 실패:", e);
                   if (!result.error) result.error = "특보";
                   // 조회 실패 = "해제 확인"이 아님 → 직전에 확인된 특보 상태를 그대로 유지 (임의 삭제 금지)
                   result.wrnOk = false;
                   if (prev) {
                       result.warnings = prev.warnings || [];
                       result.bulletin = prev.bulletin || "";
                       result.wrnCheckedAt = prev.wrnCheckedAt || prev.ts || null;
                   }
                   result.wrnStale = (result.warnings || []).length > 0;
               }
               setWeather(result);
               try { localStorage.setItem("MMEEC_WEATHER", JSON.stringify(result)); } catch {}
               setWeatherLoading(false);
           };

           // 자동 갱신: 로드 시 + 10분마다 TTL 확인
           useEffect(() => {
               fetchWeather(false);
               const t = setInterval(() => fetchWeather(false), 10 * 60 * 1000);
               return () => clearInterval(t);
           }, []);

           // ═══════════════════════════════════════════════════
           // (5번) 엑셀 다운로드 — 일반: 현재 세션만
           // ═══════════════════════════════════════════════════
           const itemsToRows = (list) => list.map(it => ({
               "공장": it.factory || "", "사업장": it.company || "", "공사명": it.title || "",
               "등급": it.grade || "", "작업": it.workType || "",
               "공사위치": it.spotLocation || "", "감독자": it.assignedSupervisor || "",
               "직영": it.directWorkers || "", "일용": it.dailyWorkers || "",
               "협력사": it.partnerName || "", "협력인원": it.partnerWorkers || "",
               "상태": it.status === "checked" ? "공사중" : "공사전",
               "연장": it.extendHour != null ? fmtExtend(it.extendHour) : "",
               "작업일수": workDayCount(it) || "",
               "메모": it.memo || "",
               "체감온도기록": (it.heatResults || []).slice().reverse()
                   .map(r => `${toHm24(r) || r.time} ${fmt1(r.value)}℃(${r.level})`).join(" | "),
           }));

           const exportExcel = (list, label) => {
               if (!list || list.length === 0) { showToast("내보낼 데이터가 없습니다."); return; }
               try {
                   const ws = XLSX.utils.json_to_sheet(itemsToRows(list));
                   const wb = XLSX.utils.book_new();
                   XLSX.utils.book_append_sheet(wb, ws, "진행기록");
                   XLSX.writeFile(wb, `포켓보드_${label}_${getWorkdayKey()}.xlsx`);
                   showToast("📊 엑셀 파일이 다운로드되었습니다.");
               } catch (e) { console.error(e); showToast("엑셀 생성 실패"); }
           };

           // ═══════════════════════════════════════════════════
           // (4번) 마스터 코드 (관리자 모드) — 서버측 RPC 검증
           // ═══════════════════════════════════════════════════
           const [showMaster, setShowMaster] = useState(false);
           // (v2.18) 접속 현황 히든 메뉴 (정보팝업 ⚡ 터치 → 레벨2 암호)
           // (v2.20) 다크모드 — 기기별 저장, 시스템 설정과 무관하게 사용자가 직접 켜고 끔
           const [darkMode, setDarkMode] = useState(() => localStorage.getItem("MMEEC_DARK") === "1");
           const toggleDarkMode = () => {
               setDarkMode(prev => {
                   const next = !prev;
                   localStorage.setItem("MMEEC_DARK", next ? "1" : "0");
                   return next;
               });
           };
           const [showAccess, setShowAccess] = useState(false);
           const [accessCode, setAccessCode] = useState("");
           const [accessStats, setAccessStats] = useState(null);   // [{day, factory, devices}]
           const [accessBusy, setAccessBusy] = useState(false);
           const [accessErr, setAccessErr] = useState("");
           const [masterCode, setMasterCode] = useState("");        // 입력값 (메모리만, 저장 안 함)
           const [masterAuthed, setMasterAuthed] = useState(false);
           const [masterLevel, setMasterLevel] = useState(() => {
               // (23번) 30일 인증 캐시에 권한 레벨 저장 (1=일반 관리자, 2=최고 관리자)
               try {
                   const at = Number(localStorage.getItem("MMEEC_ADMIN_AT") || 0);
                   const ADMIN_TTL = 30 * 24 * 60 * 60 * 1000;
                   if (at > 0 && Date.now() - at < ADMIN_TTL) return Number(localStorage.getItem("MMEEC_ADMIN_LV") || 2);
               } catch {}
               return 0;
           });
           const [masterSessions, setMasterSessions] = useState([]);
           const [masterContacts, setMasterContacts] = useState(null); // null=미로드
           const [masterBusy, setMasterBusy] = useState(false);
           const [regCode, setRegCode] = useState("");
           const [regName, setRegName] = useState("");
           const [ctName, setCtName] = useState("");
           const [ctPhone, setCtPhone] = useState("");
           const [ctFactory, setCtFactory] = useState("");
           const [ctDept, setCtDept] = useState("");

           // (13번) 관리자 인증 상태 30일 유지 + 연락처 캐시 (본인 기기 전용)
           const ADMIN_TTL = 30 * 24 * 60 * 60 * 1000;
           const [adminAuthed, setAdminAuthed] = useState(() => {
               try {
                   const at = Number(localStorage.getItem("MMEEC_ADMIN_AT") || 0);
                   return at > 0 && Date.now() - at < ADMIN_TTL;
               } catch { return false; }
           });
           // 캐시된 연락처 (관리자 기기에서 전화 연결용)
           const [contactBook, setContactBook] = useState(() => {
               try {
                   const at = Number(localStorage.getItem("MMEEC_ADMIN_AT") || 0);
                   if (at > 0 && Date.now() - at < ADMIN_TTL) {
                       return JSON.parse(localStorage.getItem("MMEEC_CONTACTS") || "[]");
                   }
               } catch {}
               return [];
           });
           // 공장 → 담당 부서 역추론 테이블 (카드 공장으로 후보 부서 판정)
           const FACTORY_DEPT_MAP = {
               "1공장": ["영업1"], "2공장": ["영업2"], "3공장": ["영업3"], "4공장": ["영업4"], "5공장": ["영업5"],
               "6.엔진": ["PT설비", "PT집진1"], "7.변속기": ["PT집진2"], "8.소재": ["소재집진", "8.소재"],
               "10.아산": ["아산"],
           };
           // 1~5공장 어디서든 후보가 되는 전공장 부서 (정확한 부서명)
           const WIDE_DEPTS = ["프레스(전공장)", "차체로봇(전공장)", "차체기술(전공장)", "자동기(전공장)", "PT로봇(엔변)"];
           // 카드 감독자 → 연락처 매칭 (공장→부서 역추론 + 이름 일치)
           const findContact = (item) => {
               if (!adminAuthed || !item.assignedSupervisor) return null;
               const nm = item.assignedSupervisor.trim().replace(/2$/, ""); // 이화선2 등 정규화
               const fac = (item.factory || "").trim();
               const deptCandidates = FACTORY_DEPT_MAP[fac] || [];
               const isMainFactory = /^[1-5]공장$/.test(fac);
               // 후보 부서(해당 공장 담당 + 전공장부서) 안에서 이름 일치 우선
               const inScope = contactBook.find(c => {
                   if ((c.name || "").trim().replace(/2$/, "") !== nm) return false;
                   const d = c.dept || "";
                   if (deptCandidates.includes(d)) return true;
                   if (isMainFactory && WIDE_DEPTS.includes(d)) return true;
                   return false;
               });
               if (inScope) return inScope;
               // 폴백: 공장 필드 직접 일치 → 이름만 일치
               return contactBook.find(c => (c.name || "").trim().replace(/2$/, "") === nm && (c.factory || "").trim() === fac)
                   || contactBook.find(c => (c.name || "").trim().replace(/2$/, "") === nm) || null;
           };

           const rpc = async (fn, params) => {
               const cfg = window.APP_CONFIG || {};
               const res = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${fn}`, {
                   method: "POST",
                   headers: {
                       apikey: cfg.supabaseKey,
                       Authorization: `Bearer ${cfg.supabaseKey}`,
                       "Content-Type": "application/json",
                   },
                   body: JSON.stringify(params),
               });
               if (!res.ok) throw new Error(`RPC ${fn} 실패 (${res.status})`);
               const text = await res.text();
               return text ? JSON.parse(text) : null;
           };

           // (20번) 공지 조회 → 새 공지(수정시각 최신)면 자동 팝업
           // (v2.17) 앱을 켜둔 상태에서도 새 공지가 바로 전달되도록:
           //   · 5분마다 폴링  · 화면으로 복귀할 때(다른 앱에서 돌아옴 등) 즉시 확인
           const checkNotice = async () => {
               try {
                   const cfg = window.APP_CONFIG || {};
                   if (!cfg.supabaseUrl) return;
                   const rows = await rpc("get_notice", {});
                   const n = Array.isArray(rows) ? rows[0] : rows;
                   if (!n || !n.body || !n.body.trim()) return;
                   setNotice(n);
                   const seen = localStorage.getItem("MMEEC_NOTICE_SEEN") || "";
                   if (seen !== n.updated_at) setShowNotice(true);
               } catch (e) { /* 공지 없거나 서버 미설정 — 조용히 무시 */ }
           };

           useEffect(() => {
               checkNotice();
               const timer = setInterval(checkNotice, 5 * 60 * 1000); // 5분
               const onVisible = () => { if (!document.hidden) checkNotice(); };
               document.addEventListener("visibilitychange", onVisible);
               window.addEventListener("focus", checkNotice);
               return () => {
                   clearInterval(timer);
                   document.removeEventListener("visibilitychange", onVisible);
                   window.removeEventListener("focus", checkNotice);
               };
           }, []);

           // (v2.25) 접속 기록 — 앱 실행 시 1회. 기기ID는 브라우저가 만든 난수(개인 식별 아님)
           //         카톡 iOS 인앱 브라우저는 "Safari로 열어주세요" 안내만 보여주는 화면이라
           //         실제 앱 진입이 아님 → 이 상태에서는 접속 기록을 건너뛰어 중복 집계 방지
           useEffect(() => {
               (async () => {
                   try {
                       if (window.__KAKAO_IOS__) return; // 카톡 iOS 안내 화면 — 실제 앱 진입 아님
                       const cfg = window.APP_CONFIG || {};
                       if (!cfg.supabaseUrl) return;
                       let dev = localStorage.getItem("MMEEC_DEVICE_ID");
                       if (!dev) {
                           dev = (window.crypto?.randomUUID?.() ||
                                  (Date.now().toString(36) + Math.random().toString(36).slice(2).padEnd(16, "0")));
                           localStorage.setItem("MMEEC_DEVICE_ID", dev);
                       }
                       const my = myFactories && myFactories.length ? myFactories[0] : "";
                       await rpc("log_access", { p_device: dev, p_factory: my });
                   } catch (e) { /* 미설정/오프라인 — 조용히 무시 */ }
               })();
           }, [isLoading]);

           const loadAccessStats = async () => {
               const code = accessCode.trim();
               if (!code) return;
               setAccessBusy(true); setAccessErr("");
               try {
                   const rows = await rpc("master_access_stats", { p_code: code });
                   setAccessStats(Array.isArray(rows) ? rows : []);
                   setAccessCode("");
               } catch (e) {
                   setAccessErr("코드가 올바르지 않거나 서버 설정(supabase-access-v1.sql)이 미적용 상태입니다.");
               } finally { setAccessBusy(false); }
           };

           const closeAccess = () => {
               setShowAccess(false); setAccessCode(""); setAccessStats(null); setAccessErr("");
           };

           const dismissNotice = () => {
               if (notice) localStorage.setItem("MMEEC_NOTICE_SEEN", notice.updated_at);
               setShowNotice(false);
           };

           const masterSaveNotice = async () => {
               setMasterBusy(true);
               try {
                   await rpc("master_set_notice", { p_code: masterCode.trim(), p_body: noticeDraft });
                   showToast("공지사항이 저장됐습니다.");
                   // 방금 저장한 관리자 본인은 다시 안 뜨도록 seen 갱신
                   const rows = await rpc("get_notice", {});
                   const n = Array.isArray(rows) ? rows[0] : rows;
                   if (n) { setNotice(n); localStorage.setItem("MMEEC_NOTICE_SEEN", n.updated_at); }
               } catch (e) { showToast("공지 저장 실패"); } finally { setMasterBusy(false); }
           };

           const masterLogin = async () => {
               if (!masterCode.trim()) { showToast("마스터 코드를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   // (23번) 권한 레벨 확인 (0=불일치, 1=일반 관리자, 2=최고 관리자)
                   const lv = await rpc("master_level", { p_code: masterCode.trim() });
                   const level = Number(lv) || 0;
                   if (level < 1) {
                       showToast("마스터 코드가 올바르지 않습니다.");
                       setMasterBusy(false); return;
                   }
                   setMasterLevel(level);
                   setMasterAuthed(true);
                   // 세션 등록소는 상위 권한만 조회
                   if (level >= 2) {
                       const rows = await rpc("master_list_sessions", { p_code: masterCode.trim() });
                       setMasterSessions(rows || []);
                   } else {
                       setMasterSessions([]);
                   }
                   // (13번) 관리자 인증 30일 저장 + 연락처 캐시 + 레벨 저장
                   try {
                       const contacts = await rpc("master_list_contacts", { p_code: masterCode.trim() }) || [];
                       localStorage.setItem("MMEEC_ADMIN_AT", String(Date.now()));
                       localStorage.setItem("MMEEC_ADMIN_LV", String(level));
                       localStorage.setItem("MMEEC_CONTACTS", JSON.stringify(contacts));
                       setAdminAuthed(true);
                       setContactBook(contacts);
                       setMasterContacts(contacts);
                   } catch (e2) { console.warn("연락처 캐시 실패:", e2); }
                   setNoticeDraft(notice?.body || "");
               } catch (e) {
                   console.error(e);
                   showToast("마스터 코드가 올바르지 않거나 서버 설정(supabase-master-v3.sql)이 미적용 상태입니다.");
               } finally { setMasterBusy(false); }
           };

           // 관리자 인증 해제 (기기에서 로그아웃)
           const adminLogout = () => {
               localStorage.removeItem("MMEEC_ADMIN_AT");
               localStorage.removeItem("MMEEC_ADMIN_LV");
               localStorage.removeItem("MMEEC_CONTACTS");
               setAdminAuthed(false);
               setMasterLevel(0);
               setContactBook([]);
               showToast("이 기기의 관리자 인증을 해제했습니다.");
           };

           const masterRefreshSessions = async () => {
               try { setMasterSessions(await rpc("master_list_sessions", { p_code: masterCode.trim() }) || []); }
               catch (e) { showToast("목록 갱신 실패"); }
           };

           const masterAddSession = async () => {
               if (!regCode.trim()) { showToast("세션 코드를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   await rpc("master_upsert_session", { p_code: masterCode.trim(), p_session: regCode.trim(), p_site: regName.trim() || regCode.trim() });
                   setRegCode(""); setRegName("");
                   await masterRefreshSessions();
                   showToast("현장 코드가 등록되었습니다.");
               } catch (e) { showToast("등록 실패"); } finally { setMasterBusy(false); }
           };

           const masterDeleteSession = async (code) => {
               setMasterBusy(true);
               try {
                   await rpc("master_delete_session", { p_code: masterCode.trim(), p_session: code });
                   await masterRefreshSessions();
                   showToast("삭제되었습니다.");
               } catch (e) { showToast("삭제 실패"); } finally { setMasterBusy(false); }
           };

           const masterExportAll = async () => {
               setMasterBusy(true);
               try {
                   const rows = await rpc("master_export", { p_code: masterCode.trim() }) || [];
                   if (rows.length === 0) { showToast("내보낼 세션 데이터가 없습니다."); return; }
                   const wb = XLSX.utils.book_new();
                   rows.forEach(r => {
                       const list = Array.isArray(r.items) ? r.items : [];
                       const ws = XLSX.utils.json_to_sheet(itemsToRows(list));
                       const name = String(r.site_name || r.session_id).slice(0, 28).replace(/[\\\/\?\*\[\]:]/g, "_") || "세션";
                       XLSX.utils.book_append_sheet(wb, ws, name);
                   });
                   XLSX.writeFile(wb, `포켓보드_전체통합_${getWorkdayKey()}.xlsx`);
                   showToast("📊 전체 통합 엑셀이 다운로드되었습니다.");
               } catch (e) { console.error(e); showToast("전체 내보내기 실패"); }
               finally { setMasterBusy(false); }
           };

           const masterLoadContacts = async () => {
               setMasterBusy(true);
               try {
                   const list = await rpc("master_list_contacts", { p_code: masterCode.trim() }) || [];
                   setMasterContacts(list);
                   // 전화 연결용 캐시도 동기화
                   setContactBook(list);
                   if (localStorage.getItem("MMEEC_ADMIN_AT")) {
                       localStorage.setItem("MMEEC_CONTACTS", JSON.stringify(list));
                   }
               }
               catch (e) { showToast("연락처 조회 실패"); }
               finally { setMasterBusy(false); }
           };

           const masterAddContact = async () => {
               if (!ctName.trim() || !ctPhone.trim()) { showToast("이름과 연락처를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   await rpc("master_upsert_contact", { p_code: masterCode.trim(), p_name: ctName.trim(), p_phone: ctPhone.trim(), p_factory: ctFactory.trim(), p_dept: ctDept.trim() });
                   setCtName(""); setCtPhone(""); setCtFactory(""); setCtDept("");
                   await masterLoadContacts();
               } catch (e) { showToast("연락처 저장 실패"); } finally { setMasterBusy(false); }
           };

           const masterDeleteContact = async (id) => {
               setMasterBusy(true);
               try { await rpc("master_delete_contact", { p_code: masterCode.trim(), p_id: id }); await masterLoadContacts(); }
               catch (e) { showToast("삭제 실패"); } finally { setMasterBusy(false); }
           };

           const closeMaster = () => {
               setShowMaster(false); setMasterAuthed(false); setMasterCode("");
               setMasterSessions([]); setMasterContacts(null);
           };

           // (3번) PWA 설치 안내 배너 — 최초 1회
           // (v2.14) iOS 카톡 인앱 사용자는 전체화면 차단 없이 화면을 그대로 로드하고,
           // 대신 이 배너로 "홈 화면에 추가" 안내만 제공한다 (기존엔 전체화면 오버레이가 화면을 가려 진행 불가했음)
           const [showInstall, setShowInstall] = useState(() =>
               window.__KAKAO_IOS__ ||
               (!localStorage.getItem("MMEEC_INSTALL_HINTED") &&
               !window.matchMedia("(display-mode: standalone)").matches)

               const p = window.__PWA_PROMPT__;

                               <button

                           <button
                               onClick={() => { setSessionInput(sessionId); setShowSessionModal(true); }}

                               <span class="text-xs text-slate-500 font-semibold">공사 코드</span>
                               <span class="text-sm font-black text-slate-800 truncate ml-2">{sessionId}</span>

                                   초기화
                               </button>

                           {masterLevel >= 2 && (
                               <React.Fragment>
                                   <input
                                       type="file"
                                       id="excel-upload"
                                       accept=".xlsx, .xls, .csv"
                                       onChange={handleFileUpload}
                                       class="hidden"
                                   />
                                   <label
                                       htmlFor="excel-upload"
                                       class="flex-shrink-0 flex items-center gap-1.5 bg-slate-900 text-white font-medium text-xs py-2.5 px-3 rounded-xl cursor-pointer active:scale-[0.98] transition-all shadow-sm whitespace-nowrap"
                                   >
                                       <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                           <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"/>
                                       </svg>

                                   ▶
                               </button>
                           </div>
                           <span class="text-base text-slate-500 font-semibold whitespace-nowrap">

                           </span>
                       </div>
                       {isLoading ? (
                           <div class="flex flex-col items-center justify-center py-24 text-center">
                               <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4" />
                               <p class="text-sm text-slate-500 font-semibold">데이터 불러오는 중…</p>
                           </div>
                       ) : items.length === 0 ? (

                                   <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                       <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"/>
                                   </svg>
                               </div>
                               <h3 class="text-sm font-bold text-slate-800">로딩된 주말 공사 목록이 없습니다</h3>
                               <p class="text-xs text-slate-400 mt-1.5 max-w-[240px] leading-relaxed">
                                   {masterLevel >= 2
                                       ? "상단의 검은색 버튼을 눌러 관리 PC에서 가져온 주말공사 엑셀 내역 파일을 선택해주세요."
                                       : "관리자가 아직 엑셀 파일을 올리지 않았습니다. 관리자에게 문의해주세요."}
                               </p>
                           </div>
                       ) : (
                           <div class={`space-y-3.5 ${slideDir ? `slide-${slideDir}` : ""}`} onTouchStart={onListTouchStart} onTouchEnd={onListTouchEnd}>
                               {filteredItems.map(item => {
                                   const isPending = item.status === "pending";
                                   // (v2.17) TODAY 활성도 공사중도 아닌 카드는 제목까지만 접어서 표시.
                                   //  터치하면 그 자리에서 펼쳐지고, 펼친 뒤 터치하면 기존처럼 입력 바텀시트가 열린다.
                                   const cardOpen = isCardOpen(item) || expandedIds.includes(item.id);
                                   const manuallyExpanded = !isCardOpen(item) && expandedIds.includes(item.id);
                                   return (
                                       <div
                                           key={item.id}
                                           onClick={() => {
                                               if (!cardOpen) setExpandedIds(prev => [...prev, item.id]);
                                               else openBottomSheet(item);

                                           class={`bg-white rounded-2xl p-4 border transition-all duration-200 cursor-pointer active:scale-[0.99] shadow-xs relative overflow-hidden ${
                                               isPending

                                               : "border-slate-200 opacity-80"

                                       >
                                           <div class="flex items-start justify-between gap-2 mb-2.5">
                                               <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                                                   <span class={`text-base px-2 py-0.5 rounded-md font-extrabold tracking-wide whitespace-nowrap ${
                                                       item.grade === "긴급" ? "bg-rose-600 text-white" :
                                                       (item.grade || "B").startsWith("A") ? "bg-rose-100 text-rose-700" :
                                                       (item.grade || "B").startsWith("P") ? "keep-light bg-purple-100 text-purple-700" : "keep-light bg-amber-100 text-amber-800"

                                                       {item.grade === "긴급" ? "⚡ 긴급" : `${item.grade || "B"}급`}

                                                   <span class="text-base font-bold text-slate-400">NO.{item.no}</span>
