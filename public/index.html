                                                       <span class="text-base bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">{item.factory}</span>
                                                   )}
                                               </div>
 
                                               <div class="flex items-center gap-1.5 flex-shrink-0">
                                                   {/* (25번) 배정된 공사만 TODAY 배지 표시. 기본 회색 → 터치 시 파랑
                                                        (v2.19) 다른 날짜를 조회 중이면 그 날짜 기준으로 표시하고 토글은 막는다 */}

                                                   <span
                                                       onClick={(e) => { if (dateOffset === 0) toggleTodayOff(item, e); else e.stopPropagation(); }}

                                                           dateOffset !== 0
                                                               ? "bg-sky-100 text-sky-600"
                                                               : isTodayActive(item)
                                                                   ? "bg-sky-500 text-white cursor-pointer active:scale-95"
                                                                   : "bg-slate-200 text-slate-400 italic cursor-pointer active:scale-95"

                                                   <span class={`text-base px-2 py-0.5 rounded-full font-bold flex-shrink-0 whitespace-nowrap ${

                                                       !after17 ? "bg-emerald-500 text-white" :
                                                       item.extendHour != null ? "bg-indigo-500 text-white" : "bg-slate-400 text-white"
                                                   }`}>
                                                       {isPending ? "공사전" :
                                                        !after17 ? "공사중" :
                                                        item.extendHour != null ? fmtExtend(item.extendHour) : "종료"}

                                               </div>
                                           </div>

                                           <h4 class={`text-lg font-bold text-slate-900 leading-snug ${cardOpen ? "mb-1" : ""}`}>{item.title}</h4>
                                           {!cardOpen ? null : (
                                           <p class="text-base text-slate-500 mb-2 font-medium">
                                               상세위치: <span class="text-slate-700 font-semibold">{item.location || "-"}</span>
                                               <span class="mx-2 text-slate-300">|</span>
                                               작업: <span class="text-slate-700 font-semibold">{item.workType || "일반"}</span>
                                           </p>
                                           )}
                                           {manuallyExpanded && (
                                               <button type="button"
                                                   onClick={(e) => { e.stopPropagation(); setExpandedIds(prev => prev.filter(id => id !== item.id)); }}
                                                   class="text-xs text-slate-400 font-bold mb-2 active:scale-95 transition-all">
                                                   ▲ 접기
                                               </button>
                                           )}
                                           {cardOpen && (
                                           <React.Fragment>
 
                                           <div class="bg-slate-50 rounded-xl p-2.5 space-y-1.5 text-sm">
                                               <div class="flex items-center justify-between border-t border-slate-200/50 pt-1.5">
                                                   <span class="text-base text-slate-900 font-bold">🎯 공사위치</span>
                                                   <span class={`font-black ${item.spotLocation ? "text-amber-600" : "text-rose-500 animate-pulse"}`}>
                                                       {item.spotLocation || "미입력 상태"}
                                                   </span>
                                               </div>
                                               <div class="flex items-center justify-between border-t border-slate-200/50 pt-1.5">
                                                   <span class="text-base text-slate-900 font-bold">🟡 담당 감독자</span>
                                                   <span class="flex items-center gap-2">
                                                       <span class={`font-bold ${item.assignedSupervisor ? "text-slate-800" : "text-rose-500 font-black"}`}>
                                                           {item.assignedSupervisor || "미배정"}
                                                       </span>
                                                       {/* (13번) 관리자 인증 기기에서만 전화 아이콘 표시 */}
                                                       {(() => {
                                                           const c = findContact(item);
                                                           return c ? (
                                                               <a href={`tel:${c.phone}`} onClick={(e) => e.stopPropagation()}
                                                                   class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-emerald-500 text-white active:scale-90 transition-all shadow-sm">
                                                                   <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                                                               </a>
                                                           ) : null;
                                                       })()}
                                                   </span>
                                               </div>
                                               {item.memo && (
                                                   <div class="text-sm text-amber-700 bg-amber-50/50 p-1.5 rounded-lg mt-1 border border-amber-100/50">
                                                       📝 {item.memo}
                                                   </div>
                                               )}
                                               {/* 체감온도 - 오늘(06시 체계) 기록만 표시 */}
                                               {item.lastHeatStatus && (!item.lastHeatStatus.workday || item.lastHeatStatus.workday === workday) && (
                                                   <div class={`flex items-center justify-between mt-2 px-3 py-2 rounded-xl ${
                                                       item.lastHeatStatus.color === "red"    ? "bg-red-600" :
                                                       item.lastHeatStatus.color === "orange" ? "bg-orange-400" :
                                                       item.lastHeatStatus.color === "yellow" ? "bg-yellow-400" :
                                                       item.lastHeatStatus.color === "sky"    ? "bg-sky-400" :
                                                       "bg-slate-100"
                                                   }`}>
                                                       <span class="text-xs font-bold" style={{color: item.lastHeatStatus.color === "red" ? "#ffffff" : "#000000"}}>🌡️ 체감온도</span>
                                                       <span class="text-sm font-black flex items-center gap-1" style={{color: item.lastHeatStatus.color === "red" ? "#ffffff" : "#000000"}}>
                                                           {item.lastHeatStatus.color === "sky"    ? "○" :
                                                            item.lastHeatStatus.color === "yellow" ? "■" :
                                                            item.lastHeatStatus.color === "orange" ? "▲" :
                                                            item.lastHeatStatus.color === "red"    ? "◆" : ""}
                                                           {fmt1(item.lastHeatStatus.value)}℃ {item.lastHeatStatus.level}
                                                       </span>
                                                   </div>
                                               )}
                                           </div>

                                           {/* (v2.22) 카드에서 바로 처리: 체감온도 계산 / 안전보고문 복사
                                                카톡복사는 바텀시트로 이동함 */}
                                           <div class="mt-3 space-y-2" onClick={(e) => e.stopPropagation()}>
                                               {cardHeatOpen === item.id && (
                                                   <div class="bg-sky-50 border border-sky-200 rounded-xl p-3 space-y-2">
                                                       <div class="grid grid-cols-2 gap-2">
                                                           <div class="relative">

                                               <p class="text-sm font-bold text-emerald-600">특보 없음</p>

                                               </p>

                           </div>

                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                       <input type="tel" value={ctPhone} onChange={(e) => setCtPhone(e.target.value)} placeholder="연락처"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                       <input type="text" value={ctDept} onChange={(e) => setCtDept(e.target.value)} placeholder="부서"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                       <input type="text" value={ctFactory} onChange={(e) => setCtFactory(e.target.value)} placeholder="공장"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                   </div>
                                                   <button onClick={masterAddContact} disabled={masterBusy}
                                                       class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm active:scale-95 disabled:opacity-50">연락처 추가</button>
                                               </>
                                           )}
                                       </div>

                                       {adminAuthed && (
                                           <p class="text-xs text-emerald-600 font-semibold text-center">✅ 이 기기는 관리자 인증됨 ({masterLevel >= 2 ? "최고 관리자" : "일반 관리자"}) — 감독자 카드에 전화 버튼 표시 (30일 유지)</p>
                                       )}
                                       <div class="grid grid-cols-2 gap-3">
                                           <button onClick={adminLogout} class="w-full bg-rose-50 text-rose-500 font-bold py-3.5 rounded-xl text-sm active:scale-95 transition-all">인증 해제</button>
                                           <button onClick={closeMaster} class="w-full bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl text-base active:scale-95 transition-all">닫기</button>
                                       </div>
                                   </div>
                               )}
                           </div>
                       </div>
                   )}

                   {/* ══ (3번) 홈화면 설치 안내 (최초 1회) ══ */}
                   {showInstall && !isLoading && (
                       <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-2xl p-4 shadow-2xl z-40 flex items-center gap-3">
                           <div class="text-2xl">📲</div>
                           <div class="flex-1 min-w-0">
                               <p class="text-sm font-bold">홈 화면에 추가하면 앱처럼 쓸 수 있어요</p>
                               <p class="text-xs text-slate-400 mt-0.5">
                                   {window.__KAKAO_IOS__ ? "카카오톡 안에서는 일부 기능이 제한돼요. Safari 공유(⬆️) → \"홈 화면에 추가\" 후 이용해주세요" :
                                    window.__PWA_PROMPT__ ? "아래 버튼 한 번이면 설치 완료" :
                                    /iPhone|iPad/i.test(navigator.userAgent) ? "Safari 공유(⬆️) → \"홈 화면에 추가\"" :
                                    "브라우저 메뉴(⋮) → \"홈 화면에 추가\""}
                               </p>
                           </div>
                           {window.__PWA_PROMPT__ && (
                               <button onClick={doInstall} class="bg-amber-400 text-slate-900 text-xs font-black px-3 py-2 rounded-xl active:scale-95">설치</button>
                           )}
                           <button onClick={dismissInstall} class="text-slate-400 text-lg font-bold px-1">✕</button>
                       </div>
                   )}

                   {/* ══ (v2.14) iOS 카톡 인앱 전체화면 차단 오버레이 제거 ══
                        기존엔 여기서 화면 전체를 가려 "안내문만 보이고 진행 불가" 문제가 있었음.
                        이제는 화면을 그대로 로드하고, 위 showInstall 배너로만 안내한다. */}

               </div>
           );
       }

       const container = document.getElementById('root');
       const root = ReactDOM.createRoot(container);
       root.render(<App />);
 </script>
</body>
</html>
