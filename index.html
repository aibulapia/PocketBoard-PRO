   <script>
       // ── 카톡 인앱브라우저 → 기본 브라우저 유도 (3번) ──────────
       (function () {
           try {
               const ua = navigator.userAgent || "";
               if (!/KAKAOTALK/i.test(ua)) return;
               const url = location.href;
               if (/android/i.test(ua)) {
                   // 카카오톡 공식 외부브라우저 스킴 → 실패 대비 intent 폴백
                   location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
                   setTimeout(() => {
                       location.href =
                           "intent://" + url.replace(/^https?:\/\//, "") +
                           "#Intent;scheme=https;package=com.android.chrome;end";
                   }, 800);
               } else {
                   // iOS: 자동 이동 제약 → 안내 오버레이 표시
                   window.__KAKAO_IOS__ = true;
               }
           } catch (e) { /* 무시 */ }
       })();

       // ── PWA 설치 프롬프트 캡처 (Android Chrome) ──────────
       window.__PWA_PROMPT__ = null;
       window.addEventListener("beforeinstallprompt", (e) => {
           e.preventDefault();
           window.__PWA_PROMPT__ = e;
       });
   </script>
   <script>
       Babel.registerPreset('react-classic', {
           presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
       });
   </script>
   <script type="text/babel" data-presets="react-classic">
       const { useState, useEffect, useMemo } = React;

       // 앱 버전 및 관리 암호 (클라이언트 노출 전제 — 실수 방지용 잠금 수준)
       const APP_VERSION = "2.6";
       const ADMIN_PASSWORD = "1895";

       // ── 외부 데이터 (data.js) ─────────────────────────
       const D = window.APP_DATA || {};
       const SUPPORTED_FACTORIES = D.SUPPORTED_FACTORIES || [];
       const SUB_FACTORIES = D.SUB_FACTORIES || {};
       const FIXED_SUPERVISORS = D.FIXED_SUPERVISORS || {};
       const FLOOR_TABS = D.FLOOR_TABS || ["B1","1층","2층","2.5층","3층","옥상","옥외"];
       const WORK_TYPE_SAFETY = D.WORK_TYPE_SAFETY || {};
       const COMMON_MEASURES = D.COMMON_MEASURES || [];

       // ── 06시 일일 체계 유틸 (하루 = 06:00 ~ 익일 05:59) ──
       const WORKDAY_SHIFT_MS = 6 * 60 * 60 * 1000;
       const getWorkdayDate = (d = new Date()) => new Date(d.getTime() - WORKDAY_SHIFT_MS);
       const getWorkdayKey = (d = new Date()) => {
           const t = getWorkdayDate(d);
           return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
       };
       const getWorkdayDow = (d = new Date()) => getWorkdayDate(d).getDay();
       // 17시 이후(~익일 06시 전) 여부 — 목록 배지 전환용
       const isAfter17 = (d = new Date()) => { const h = d.getHours(); return h >= 17 || h < 6; };
       // 연장 표기: "22시연장" / "01시연장" (24시간제, 2자리)
       const fmtExtend = (h) => (h == null ? "" : `${String(h).padStart(2, "0")}시연장`);
       // 체감온도 소수점 1자리 통일 표기
       const fmt1 = (v) => { const n = Number(v); return isNaN(n) ? String(v) : n.toFixed(1); };
       // "HH:MM" (24h) 현재 시각
       const nowHm = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
       // 구형 기록(오전/오후 표기) → "HH:MM" 변환
       const toHm24 = (r) => {
           if (r.hm) return r.hm;
           const s = String(r.time || "");
           const m = s.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
           if (!m) return null;
           let h = parseInt(m[2], 10);
           if (m[1] === "오후" && h < 12) h += 12;
           if (m[1] === "오전" && h === 12) h = 0;
           return `${String(h).padStart(2, "0")}:${m[3]}`;
       };

       // 공장 이름 자동 보정 로직
       const normalizeFactoryName = (rawName) => {
           if (!rawName) return "9.기타";
           const name = rawName.toString().trim();
           if (name.includes("1공장") || name === "1") return "1공장";
           if (name.includes("2공장") || name === "2") return "2공장";
           if (name.includes("3공장") || name === "3") return "3공장";
           if (name.includes("4공장") || name === "4") return "4공장";
           if (name.includes("5공장") || name === "5") return "5공장";
           if (name.includes("엔진")) return "6.엔진";
           if (name.includes("변속기")) return "7.변속기";
           if (name.includes("소재")) return "8.소재";
		   if (name.includes("기타")) return "9.기타";
           if (name.includes("아산")) return "10.아산";
           if (name.includes("남양")) return "11.남양";
           if (name.includes("광명")) return "12.광명";
           return "9.기타";
       };

       function App() {
           const [items, setItems] = useState([]);
           const [activeTab, setActiveTab] = useState("전체");
           const [selectedItem, setSelectedItem] = useState(null);
           const [toast, setToast] = useState(null);
           const [sessionId, setSessionId] = useState(MMEECStorage.getSessionId());
           const [sheetTitle, setSheetTitle] = useState("");
           const [syncStatus, setSyncStatus] = useState("idle");
           const [isLoading, setIsLoading] = useState(true);
           const [showSessionModal, setShowSessionModal] = useState(false);
           const [sessionInput, setSessionInput] = useState(MMEECStorage.getSessionId());

           // 회사명 (수정 가능, localStorage 저장)
           const [companyName, setCompanyName] = useState(() =>
               localStorage.getItem("MMEEC_COMPANY_NAME") || "MMEEC"
           );
           const [companyNameDraft, setCompanyNameDraft] = useState("");

           // 프로그램 정보 모달
           const [showInfo, setShowInfo] = useState(false);

           // 암호 입력 모달 (초기화 / 회사명 수정 공용)
           const [showPwModal, setShowPwModal] = useState(false);
           const [pwInput, setPwInput] = useState("");
           const [pwTarget, setPwTarget] = useState(""); // "reset" | "company"
           const [pwError, setPwError] = useState(false);

           // 최초 실행 여부 (내 공장 세팅 팝업)
           const [firstRun] = useState(() => !localStorage.getItem("MMEEC_MY_FACTORIES"));

           // 개인별 공장 필터 (localStorage 기반, 기기마다 독립)
           //  (12번) 기본값 자동 지정 제거 — 최초엔 null, 강제 설정 유도
           const [myFactories, setMyFactories] = useState(() => {
               try {
                   const saved = localStorage.getItem("MMEEC_MY_FACTORIES");
                   if (saved) { const v = JSON.parse(saved); return (Array.isArray(v) && v.length) ? v : null; }
                   return null;
               } catch { return null; }
           });
           const [showFactoryFilter, setShowFactoryFilter] = useState(false);
           const [filterDraft, setFilterDraft] = useState([]);

           // 바텀시트 입력 폼 상태 관리
           const [spotLocation, setSpotLocation] = useState("");
           const [assignedSupervisor, setAssignedSupervisor] = useState("");
           const [memo, setMemo] = useState("");
           const [directWorkers, setDirectWorkers] = useState("");
           const [dailyWorkers, setDailyWorkers] = useState("");
           const [partnerName, setPartnerName] = useState("");
           const [partnerWorkers, setPartnerWorkers] = useState("");
           const [reportStage, setReportStage] = useState("전");   // 전 / 중 / 후
           const [hasElderly, setHasElderly] = useState(false);
           const [elderlyCount, setElderlyCount] = useState(1);
           const [extendHour, setExtendHour] = useState(null);   // (6번) 작업연장 종료시각 (0~23, null=없음)

           // 체감온도(열지수) 계산기
           const [heatTemp, setHeatTemp] = useState("");
           const [heatHumidity, setHeatHumidity] = useState("");
           const [heatResults, setHeatResults] = useState([]); // 누적 결과 배열
           const [currentHeatStatus, setCurrentHeatStatus] = useState(null); // 바텀시트 내 계산기 표시용만

           // ── 구글 시트 체감온도 자동 기록 ──────────────
           const sendHeatToSheet = async (item, entry) => {
               const cfg = window.APP_CONFIG || {};
               if (!cfg.sheetsWebhookUrl) return; // URL 미설정 시 무시
               try {
                   await fetch(cfg.sheetsWebhookUrl, {
                       method: "POST",
                       headers: { "Content-Type": "text/plain" },
                       body: JSON.stringify({
                           token: cfg.sheetsToken || "",
                           factory: item.factory || "",
                           company: item.company || item.location || "",
                           title: item.title || "",
                           grade: item.grade || "",
                           workType: item.workType || "",
                           value: entry.value,
                           level: entry.level,
                           temp: entry.temp,
                           humidity: entry.humidity,
                       }),
                   });
               } catch (e) {
                   console.warn("시트 기록 실패:", e);
               }
           };

           // 안전보건공단/기상청 공식 체감온도 (2022.6.2 개정 산출식)
           // Tw: 습구온도 (Stull 추정식), Ta: 기온, RH: 상대습도
           const calcHeatIndex = () => {
               const Ta = parseFloat(heatTemp);
               const RH = parseFloat(heatHumidity);
               if (isNaN(Ta) || isNaN(RH)) {
                   showToast("기온과 습도를 입력해주세요.");
                   return;
               }

               // Stull(2011) 습구온도 추정식
               const Tw = Ta * Math.atan(0.151977 * Math.pow(RH + 8.313659, 0.5))
                   + Math.atan(Ta + RH)
                   - Math.atan(RH - 1.67633)
                   + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH)
                   - 4.686035;

               // 기상청 2022 개정 체감온도 공식
               const HIc = -0.2442 + 0.55399 * Tw + 0.45535 * Ta
                   - 0.0022 * Tw * Tw + 0.00278 * Tw * Ta + 3.0;

               // KOSHA 포털 색상 기준
               let level, color, guide;
               if (HIc >= 38)      { level = "위험";  color = "red";    guide = "작업 중지 권고, 즉시 대피"; }
               else if (HIc >= 35) { level = "경고";  color = "orange"; guide = "매시간 15분 휴식 권고"; }
               else if (HIc >= 33) { level = "주의";  color = "yellow"; guide = "2시간 작업 시 20분 휴식"; }
               else if (HIc >= 31) { level = "관심";  color = "sky";    guide = "충분한 물 섭취, 주기적 휴식"; }
               else                { level = "보통";  color = "slate";  guide = "쾌적한 작업 환경"; }

               const entry = {
                   temp: Ta, humidity: RH,
                   value: HIc.toFixed(1),               // 소수점 1자리 통일
                   level, color, guide,
                   workday: getWorkdayKey(),            // 06시 체계 일자
                   hm: nowHm(),                          // 24시간제 HH:MM
                   time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
               };
               const newDisplay = [entry, ...heatResults];
               setHeatResults(newDisplay);
               setCurrentHeatStatus(entry);
               // 해당 카드에 저장: 화면은 오늘 것만, 데이터는 전체 이력 보존
               if (selectedItem) {
                   const updatedItems = items.map(it =>
                       it.id === selectedItem.id
                           ? { ...it, lastHeatStatus: entry, heatResults: [entry, ...(it.heatResults || [])] }
                           : it
                   );
                   persistItems(updatedItems);
                   sendHeatToSheet(selectedItem, entry);
               }
           };

           // 긴급공사 직접 입력 모달 상태 관리 (5단계 프로세스용)
           const [showAddModal, setShowAddModal] = useState(false);
           const [addModalTab, setAddModalTab] = useState("extra"); // "extra" | "urgent"
           const [selectedExtras, setSelectedExtras] = useState([]);
           const [urgentFactory, setUrgentFactory] = useState("1공장");
           const [urgentSubFactory, setUrgentSubFactory] = useState("");
           const [urgentWorkLocation, setUrgentWorkLocation] = useState("");
           const [urgentWorkContent, setUrgentWorkContent] = useState("");
           const [urgentWorkTypes, setUrgentWorkTypes] = useState([]);
           const [urgentSupervisor, setUrgentSupervisor] = useState("");

           const WORK_TYPE_OPTIONS = D.WORK_TYPE_OPTIONS || ["고소", "중량물", "화기", "밀폐", "건설기계", "전기"];

           // ── 분 단위 틱: 06시 넘김/17시 전환 자동 감지용 리렌더 ──
           const [nowTick, setNowTick] = useState(() => new Date());
           useEffect(() => {
               const t = setInterval(() => setNowTick(new Date()), 60 * 1000);
               return () => clearInterval(t);
           }, []);
           const workday = getWorkdayKey(nowTick);
           const todayDow = getWorkdayDow(nowTick);
           const after17 = isAfter17(nowTick);

           // (7번 개선) TODAY = 수동 ON 모델
           //  기본: 모든 카드 회색(비활성). 사용자가 터치한 날만 파랑(활성).
           //  todayOn === 현재 workday 이면 활성.
           const isTodayActive = (item) => item.todayOn === workday;
           // n일째(8번): 과거 확정 작업일 + 오늘 활성이면 +1
           const workDayCount = (item) => (item.pastWorkDays || 0) + (isTodayActive(item) ? 1 : 0);

           // ── 일일 사이클 엔진 (10번): 06시 리셋 + 8번 카운트 확정 ──
           const applyDailyCycle = (list) => {
               const wd = getWorkdayKey();
               let changed = false;
               const out = list.map(raw => {
                   let it = raw;
                   const mut = () => { if (it === raw) { it = { ...raw }; changed = true; } };
                   // (8번) 전일 활성 마크 → 작업일 확정 +1
                   if (it.activeMark && it.activeMark !== wd) {
                       mut();
                       it.pastWorkDays = (it.pastWorkDays || 0) + 1;
                       it.activeMark = null;
                   }
                   // (10번) 날짜 넘어가면 상태·연장·TODAY 리셋 (데이터는 보존)
                   if (it.dayKey !== wd) {
                       mut();
                       it.dayKey = wd;
                       if (it.status === "checked") it.status = "pending"; // 공사중 → 재확인
                       if (it.extendHour != null) it.extendHour = null;    // 연장 초기화
                       if (it.todayOn && it.todayOn !== wd) it.todayOn = null; // TODAY 자동 리셋(06시)
                   }
                   // (8번) 오늘 활성(수동 ON) 상태를 마크에 반영
                   const active = it.todayOn === wd;
                   if (active && it.activeMark !== wd) { mut(); it.activeMark = wd; }
                   if (!active && it.activeMark === wd) { mut(); it.activeMark = null; }
                   return it;
               });
               return { list: changed ? out : list, changed };
           };

           // 로드/틱 시 사이클 적용
           useEffect(() => {
               if (isLoading || items.length === 0) return;
               const { list, changed } = applyDailyCycle(items);
               if (changed) persistItems(list);
           }, [isLoading, workday, items.length]);

           // (7번) TODAY 배지 터치 토글 — 회색 ↔ 파랑
           const toggleTodayOff = (item, e) => {
               if (e) e.stopPropagation();
               const wd = getWorkdayKey();
               const updated = items.map(it => {
                   if (it.id !== item.id) return it;
                   const on = it.todayOn === wd ? null : wd;
                   return { ...it, todayOn: on, activeMark: on ? wd : null };
               });
               persistItems(updated);
           };

           const toggleUrgentWorkType = (type) => {
               setUrgentWorkTypes(prev =>
                   prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]
               );
           };

           const handleAddUrgent = () => {
               if (!urgentFactory) { showToast("공장을 선택해주세요."); return; }
               const availableSubFactories = SUB_FACTORIES[urgentFactory] || [];
               if (availableSubFactories.length > 0 && !urgentSubFactory) { showToast("하위 공장을 선택해주세요."); return; }
               if (!urgentWorkLocation.trim()) { showToast("작업 위치를 입력해주세요."); return; }
               if (!urgentWorkContent.trim()) { showToast("작업 내용을 입력해주세요."); return; }
               if (!urgentSupervisor.trim()) { showToast("담당 감독자를 입력해주세요."); return; }

               // 자동 완성 데이터 조합 (빈칸은 정규식으로 다듬어 단일 공백 처리)
               const generatedTitle = `${urgentFactory} ${urgentSubFactory} ${urgentWorkLocation.trim()} ${urgentWorkContent.trim()}`.replace(/\s+/g, ' ').trim();
               const generatedLocation = `${urgentSubFactory} ${urgentWorkLocation.trim()}`.trim();

               const newItem = {
                   id: `urgent-${Date.now()}`,
                   no: `긴급`,
                   factory: urgentFactory,
                   rawFactory: urgentFactory,
                   location: generatedLocation,
                   title: generatedTitle,
                   company: "긴급공사",
                   supervisor: urgentSupervisor.trim(),
                   assignedSupervisor: urgentSupervisor.trim(),
                   spotLocation: generatedLocation,
                   status: "pending",
                   grade: "긴급",
                   workType: urgentWorkTypes.length > 0 ? urgentWorkTypes.join("+") : "일반",
                   memo: "",
                   isUrgent: true
               };

               const updatedItems = [...items, newItem];
               persistItems(updatedItems);
               setShowAddModal(false);
               
               // 모달 닫기 시 상태 초기화
               setUrgentFactory("1공장"); 
               setUrgentSubFactory("");
               setUrgentWorkLocation(""); 
               setUrgentWorkContent("");
               setUrgentSupervisor("");
               setUrgentWorkTypes([]);
               showToast("⚡ 긴급공사가 추가되었습니다.");
           };

           const showToast = (message) => {
               setToast(message);
               setTimeout(() => setToast(null), 2500);
           };

           const persistItems = async (newItems, metaOverride) => {
               setItems(newItems);
               setSyncStatus("saving");
               const meta = metaOverride || { sheetTitle: sheetTitle || null };
               try {
                   const result = await MMEECStorage.save(newItems, meta);
                   setSyncStatus(result.mode === "cloud" ? "saved" : "local");
               } catch (e) {
                   console.error(e);
                   setSyncStatus("error");
                   showToast("저장 실패 — 네트워크 확인 후 다시 시도");
               }
           };

           useEffect(() => {
               let mounted = true;
               (async () => {
                   setIsLoading(true);
                   try {
                       const data = await MMEECStorage.load();
                       if (!mounted) return;
                       setItems(data.items || []);
                       // 진단 로그 (문제 발생 시 개발자도구 확인용)
                       console.log("[포켓보드 v" + APP_VERSION + "] 로드:", (data.items||[]).length + "건",
                           "| workday:", getWorkdayKey(), "| dow:", getWorkdayDow(),
                           "| data.js:", Object.keys(window.APP_DATA||{}).length > 0 ? "OK" : "누락!");
                       setSessionId(data.sessionId);
                       if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                       setSyncStatus(MMEECStorage.isCloudEnabled() ? "saved" : "local");
                   } catch (e) {
                       console.error(e);
                       showToast("데이터 불러오기 실패");
                   } finally {
                       if (mounted) setIsLoading(false);
                   }
               })();
               return () => { mounted = false; };
           }, []);

           // ── Realtime 구독 (세션 코드 변경 시 자동 재구독) ──────
           useEffect(() => {
               if (!MMEECStorage.isCloudEnabled()) return;
               const socket = MMEECStorage.subscribeRealtime(sessionId, async () => {
                   try {
                       const data = await MMEECStorage.load();
                       setItems(data.items || []);
                       if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                       showToast("📡 데이터가 자동으로 업데이트되었습니다.");
                   } catch (e) {
                       console.warn("Realtime 업데이트 실패:", e);
                   }
               });
               return () => { if (socket) socket.close(); };
           }, [sessionId]);

           const handleChangeSession = async () => {
               if (!sessionInput.trim()) { showToast("공사 코드를 입력해주세요."); return; }
               MMEECStorage.setSessionId(sessionInput.trim());
               setSessionId(sessionInput.trim());
               setShowSessionModal(false);
               setIsLoading(true);
               try {
                   const data = await MMEECStorage.load();
                   setItems(data.items || []);
                   if (data.meta?.sheetTitle) setSheetTitle(data.meta.sheetTitle);
                   showToast(`공사 코드 [${sessionInput.trim()}] 로드 완료`);
               } catch (e) {
                   showToast("공사 코드 데이터 불러오기 실패");
               } finally {
                   setIsLoading(false);
               }
           };

           const syncLabel = {
               idle: "준비",
               saving: "저장 중…",
               saved: "☁️ 저장됨",
               local: "📱 기기 저장",
               error: "⚠️ 저장 실패"
           }[syncStatus] || "";

           // SheetJS 활용 엑셀/CSV 파일 파싱
           const handleFileUpload = (e) => {
               const file = e.target.files[0];
               if (!file) return;

               const reader = new FileReader();
               reader.onload = (evt) => {
                   const data = new Uint8Array(evt.target.result);
                   const workbook = XLSX.read(data, { type: 'array' });
                   const firstSheetName = workbook.SheetNames[0];
                   const worksheet = workbook.Sheets[firstSheetName];
                   
                   const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                   const titleRow = rows.find(r => r && r[0] && String(r[0]).includes("주차"));
                   const detectedTitle = titleRow ? String(titleRow[0]).trim() : firstSheetName;
                   
                   // 헤더 셀 공백/병합셀 잔여 문자 제거 후 비교
                   const normCell = (c) => String(c ?? "").replace(/\s/g, "");
                   let headerRowIndex = -1;
                   for (let i = 0; i < rows.length; i++) {
                       if (!rows[i]) continue;
                       const normed = rows[i].map(normCell);
                       if (normed.includes("NO") && normed.includes("공장")) {
                           headerRowIndex = i;
                           break;
                       }
                   }

                   if (headerRowIndex === -1) {
                       // 디버깅: 실제 읽힌 상위 10행을 콘솔에 출력해 원인 파악 지원
                       console.warn("[엑셀 파싱 실패] 상위 10행 원본:", rows.slice(0, 10));
                       showToast("올바른 공사 양식 행(NO, 공장...)을 찾을 수 없습니다. (개발자도구 콘솔 참고)");
                       return;
                   }

                   const headers = rows[headerRowIndex].map(c => String(c ?? "").trim());
                   const noIdx = headers.indexOf("NO");
                   const factoryIdx = headers.indexOf("공장");
                   const bizIdx = headers.indexOf("사업장");
                   const locIdx = headers.indexOf("세부위치");
                   const nameIdx = headers.indexOf("공사명");
                   const gradeIdx = headers.indexOf("등급");
                   const workIdx = headers.indexOf("작업");
                   const supervisorIdx = headers.indexOf("감독");

                   // 날짜 컬럼 파싱: 헤더 행 또는 바로 다음 행에 "17(금),18(토),19(일)" 존재
                   const dateColMap = {}; // { colIdx: { day, dow } }  dow: 0=일,6=토
                   const dowMap = { 일: 0, 월: 1, 화: 2, 수: 3, 목: 4, 금: 5, 토: 6 };
                   const scanDateRow = (rowArr) => {
                       if (!rowArr) return;
                       rowArr.forEach((h, i) => {
                           if (h == null) return;
                           const s = String(h).trim();
                           const dowChar = (s.match(/[월화수목금토일]/) || [])[0];
                           const dayNum = (s.match(/(\d{1,2})/) || [])[1];
                           if (dowChar && dowMap[dowChar] !== undefined && dateColMap[i] === undefined) {
                               dateColMap[i] = { day: dayNum ? Number(dayNum) : 0, dow: dowMap[dowChar] };
                           }
                       });
                   };
                   scanDateRow(rows[headerRowIndex]);       // 헤더 행 자체
                   scanDateRow(rows[headerRowIndex + 1]);    // 헤더 바로 다음 행 (실제 양식)
                   // 날짜 행이 헤더 다음 행이면, 데이터는 그 다음부터 시작
                   const dateRowIsNext = Object.keys(dateColMap).length > 0 &&
                       Object.keys(dateColMap).some(ci => {
                           const cell = rows[headerRowIndex + 1]?.[ci];
                           return cell != null && /[월화수목금토일]/.test(String(cell));
                       });
                   const dataStartIndex = dateRowIsNext ? headerRowIndex + 2 : headerRowIndex + 1;
                   console.log("[엑셀] 헤더행:", headerRowIndex, "| 날짜컬럼:", dateColMap, "| 데이터시작:", dataStartIndex);

                   const parsedList = [];
                   for (let i = dataStartIndex; i < rows.length; i++) {
                       const row = rows[i];
                       if (!row || row.length === 0 || !row[noIdx]) continue;

                       const rawFactory = row[factoryIdx] || "";
                       const normalizedFactory = normalizeFactoryName(rawFactory);
                       const rawSupervisor = row[supervisorIdx] || "";

                       // 날짜별 투입 인원 수집
                       const dateWorkers = {};
                       Object.entries(dateColMap).forEach(([ci, info]) => {
                           const val = Number(row[ci] || 0);
                           dateWorkers[info.dow] = { day: info.day, workers: val };
                       });

                       // (8번) 소급 초기값: 오늘(06시 체계) 이전 날짜에 인원>0이면 이미 진행된 작업일로 카운트
                       const curDay = getWorkdayDate().getDate();
                       let initialPast = 0;
                       Object.values(dateWorkers).forEach(dw => {
                           if (dw.workers > 0 && dw.day < curDay && curDay - dw.day <= 7) initialPast++;
                       });

                       parsedList.push({
                           id: `mmeec-${row[noIdx]}-${normalizedFactory}-${String(row[nameIdx] || "").slice(0, 20)}`,
                           no: row[noIdx],
                           factory: normalizedFactory,
                           rawFactory: rawFactory,
                           location: row[locIdx] || "",
                           title: row[nameIdx] || "",
                           company: row[bizIdx] || "미지정 업체",
                           supervisor: rawSupervisor,
                           assignedSupervisor: rawSupervisor,
                           spotLocation: "",
                           status: "pending",
                           grade: row[gradeIdx] || "B",
                           workType: row[workIdx] || "",
                           memo: "",
                           dateWorkers, // { 6: {day:11,workers:5}, 0: {day:12,workers:3} }
                           pastWorkDays: initialPast,   // (8번) 엑셀 소급 초기값
                           dayKey: getWorkdayKey(),
                       });
                   }

                   if (parsedList.length > 0) {
                       const merged = MMEECStorage.mergeItems(items, parsedList);
                       const cycled = applyDailyCycle(merged).list;
                       setSheetTitle(detectedTitle);
                       persistItems(cycled, { sheetTitle: detectedTitle });
                       setActiveTab("전체");
                       const noDateCol = Object.keys(dateColMap).length === 0;
                       showToast(noDateCol
                           ? `총 ${parsedList.length}건 업로드 — ⚠️ 요일 컬럼을 못 찾아 TODAY 표시가 안 됩니다`
                           : `총 ${parsedList.length}건 업로드 (기존 입력 유지)`);
                   } else {
                       showToast("추출된 공사 데이터가 없습니다.");
                   }
               };
               reader.readAsArrayBuffer(file);
           };

           // (구 todayDow / isTodayItem 로직은 상단 06시 체계 유틸로 대체됨)

           // 당일 미포함 공사 (공사 추가 탭용) - 06시 체계 요일 기준
           const extraItems = useMemo(() => {
               return items.filter(item => {
                   if (item.isUrgent) return false;
                   const dw = item.dateWorkers?.[todayDow];
                   return !dw || dw.workers === 0;
               });
           }, [items, todayDow]);

           const toggleExtraSelect = (id) => {
               setSelectedExtras(prev =>
                   prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
               );
           };

           const addExtraItems = () => {
               const toAdd = items.map(item =>
                   selectedExtras.includes(item.id)
                       ? { ...item, dateWorkers: { ...item.dateWorkers, [todayDow]: { day: 0, workers: 1 } } }
                       : item
               );
               persistItems(toAdd);
               setSelectedExtras([]);
               setShowAddModal(false);
               showToast(`${selectedExtras.length}건이 오늘 목록에 추가됐습니다.`);
           };

           const activeFactories = useMemo(() => {
               const set = new Set(items.map(item => item.factory));
               const inData = SUPPORTED_FACTORIES.filter(f => set.has(f));
               // myFactories가 설정된 경우 해당 공장만 표시
               const filtered = myFactories
                   ? inData.filter(f => myFactories.includes(f))
                   : inData;
               return ["전체", ...filtered];
           }, [items, myFactories]);

           const filteredItems = useMemo(() => {
               // 날짜로 목록을 숨기지 않고 전체를 표시 (TODAY 배지로만 구분)
               if (activeTab === "전체") return items;
               return items.filter(item => item.factory === activeTab);
           }, [items, activeTab]);

           const getSupervisorPool = (factoryName) => {
               const fixed = FIXED_SUPERVISORS[factoryName] || [];
               const dynamicallyAssigned = items
                   .filter(item => item.factory === factoryName && item.assignedSupervisor)
                   .map(item => item.assignedSupervisor.trim());
               return Array.from(new Set([...fixed, ...dynamicallyAssigned])).filter(Boolean);
           };

           const openBottomSheet = (item) => {
               setSelectedItem(item);
               setSpotLocation(item.spotLocation || "");
               setAssignedSupervisor(item.assignedSupervisor || "");
               setMemo(item.memo || "");
               setDirectWorkers(item.directWorkers || "");
               setDailyWorkers(item.dailyWorkers || "");
               setPartnerName(item.partnerName || "");
               setPartnerWorkers(item.partnerWorkers || "");
               setReportStage(item.reportStage || "전");
               setHasElderly(item.hasElderly || false);
               setElderlyCount(item.elderlyCount || 1);
               setHeatTemp("");
               setHeatHumidity("");
               // (10번) 화면에는 오늘(06시 체계) 기록만 — 과거 데이터는 보존
               const wd = getWorkdayKey();
               setHeatResults((item.heatResults || []).filter(r => !r.workday || r.workday === wd));
               setExtendHour(item.extendHour ?? null);
           };

           // 인원수 입력값 정제: 숫자만 추출, 비숫자면 빈 문자열
           const cleanCount = (v) => {
               const n = parseInt(String(v).replace(/[^\d]/g, ""), 10);
               return isNaN(n) || n < 0 ? "" : String(n);
           };

           const handleSaveDetails = () => {
               if (!selectedItem) return;

               const isChecked = spotLocation.trim() !== "" && assignedSupervisor.trim() !== "";
               const updatedItems = items.map(item => {
                   if (item.id === selectedItem.id) {
                       return {
                           ...item,
                           spotLocation: spotLocation.trim(),
                           assignedSupervisor: assignedSupervisor.trim(),
                           ...(item.isUrgent ? { location: spotLocation.trim() } : {}),
                           memo: memo.trim(),
                           directWorkers: cleanCount(directWorkers),
                           dailyWorkers: cleanCount(dailyWorkers),
                           partnerName: partnerName.trim(),
                           partnerWorkers: cleanCount(partnerWorkers),
                           reportStage,
                           hasElderly,
                           elderlyCount: cleanCount(elderlyCount) || "1",
                           extendHour,
                           status: isChecked ? "checked" : "pending"
                       };
                   }
                   return item;
               });

               persistItems(updatedItems);
               setSelectedItem(null);
               showToast("점검 기록이 저장되었습니다.");
           };

           // 작업유형 안전대책/공통수칙은 data.js(APP_DATA)에서 로드됨

           // (1번) 단계별 폭염 기준 기록 찾기 — 06시 체계
           //  공사전: 그날 최초 기록 / 공사중: 12~14시 사이 최초 기록
           const findHeatRecordForStage = (item, stage) => {
               const wd = getWorkdayKey();
               const todays = (item.heatResults || [])
                   .filter(r => (!r.workday || r.workday === wd))
                   .map(r => ({ ...r, _hm: toHm24(r) }))
                   .filter(r => r._hm)
                   .sort((a, b) => a._hm.localeCompare(b._hm)); // 이른 시간 순
               if (todays.length === 0) return null;
               if (stage === "전") return todays[0];
               // 공사중: 12:00 ~ 14:00 사이 최초
               return todays.find(r => r._hm >= "12:00" && r._hm <= "14:00") || null;
           };

           const buildSafetyReport = (item, stage, elderly, elderlyCount, heatRec) => {
               const grade = (item.grade || "").trim();
               const workCode = (item.workType || "").trim();

               // 한 글자씩 분리 — 유효한 코드만
               const validKeys = Object.keys(WORK_TYPE_SAFETY);
               const codes = workCode.split("").filter(c => validKeys.includes(c));

               // 유형별 대표 안전대책 1개씩만
               const specificMeasures = [];
               codes.forEach(c => {
                   const entry = WORK_TYPE_SAFETY[c];
                   if (entry && entry.measures.length > 0) {
                       specificMeasures.push(entry.measures[0]);
                   }
               });

               // 공통 수칙 + 유형별 대표 1개씩
               const allMeasures = [...COMMON_MEASURES, ...specificMeasures];

               const stageLabel = stage === "전" ? "공사 전" : stage === "중" ? "공사 중" : "공사 후";
               // 작업유형: 등급만 표시
               const workTypeLine = `${grade}급`;

               // 고령자 문구
               const elderlyLine = elderly
                   ? `65세 이상 고령자 ${elderlyCount || "O"}명 / 작업 전 하지근력 및 평형성 테스트 실시`
                   : `65세 이상 작업자 없음`;

               // 작업위치: 직접 입력 우선, 없으면 사업장+세부위치
               const fallbackLocation = [item.company, item.location].filter(Boolean).join(" ");
               const location = item.spotLocation || fallbackLocation || "";

               // (1번) 폭염작업 대책 — 체감온도 수치(소수점1자리) + 단계별 조치 (31℃ 이하도 작성)
               const heatLines = heatRec ? [
                   `*폭염대책 : 체감온도 ${fmt1(heatRec.value)}℃ (${heatRec.level})`,
                   `  - ${heatRec.guide}`,
               ] : [];

               // (6번) 작업연장 표기
               const extendLine = (item.extendHour != null) ? [`*작업연장 : ${fmtExtend(item.extendHour)}`] : [];

               if (stage === "후") {
                   return [
                       `공사 후 안전작업 이행결과`,
                       `*업 체 명 : ${item.companyName || "MMEEC"}`,
                       `*허가번호 : 2607`,
                       `*작업위치 : ${location}`,
                       `*작업유형 : ${workTypeLine}`,
                       `*작업내용 : ${item.title || ""}`,
                       ...extendLine,
                       `*작업장 주변 정리정돈 후 작업 종료합니다.`,
                   ].join("\n");
               }

               return [
                   `공사 ${stage === "전" ? "전" : "중"} 안전작업 이행결과`,
                   `*업 체 명 : ${item.companyName || "MMEEC"}`,
                   `*허가번호 : 2607`,
                   `*작업위치 : ${location}`,
                   `*작업유형 : ${workTypeLine}`,
                   `*작업내용 : ${item.title || ""}`,
                   ...extendLine,
                   `*안전대책 :`,
                   ...allMeasures.map(m => `  - ${m}`),
                   ...heatLines,
                   `*65세이상 고령자 : ${elderlyLine}`,
                   `* TBM 실시 후 작업 시작합니다.`,
               ].join("\n");
           };

           // (1번) 체감온도 미측정 경고 팝업 상태
           const [heatWarn, setHeatWarn] = useState(null); // 문자열 메시지

           const handleSafetyReportCopy = (item, e) => {
               if (e) e.stopPropagation();
               const location = item.spotLocation || item.location || "";
               if (!location) {
                   showToast("작업위치를 입력해주세요.");
                   return;
               }
               const stage = item.reportStage || "전";
               // (1번) 공사전/공사중은 체감온도 기록 필수
               let heatRec = null;
               if (stage === "전" || stage === "중") {
                   heatRec = findHeatRecordForStage(item, stage);
                   if (!heatRec) {
                       setHeatWarn(stage === "전"
                           ? "오늘 체감온도 측정 기록이 없습니다.\n체감온도 계산기로 측정 후 다시 복사해주세요."
                           : "12시~14시 사이 체감온도 측정 기록이 없습니다.\n해당 시간대 측정 후 다시 복사해주세요.");
                       return;
                   }
               }
               const text = buildSafetyReport(item, stage, item.hasElderly || false, item.elderlyCount || 1, heatRec);
               navigator.clipboard.writeText(text).then(() => {
                   showToast("📋 안전보고문이 복사되었습니다.");
               }).catch(() => {
                   showToast("클립보드 복사에 실패했습니다.");
               });
           };

           // 카톡 전송용 축약 복사 (카드별 개별 실행)
           const handleKakaoCopy = (item, e) => {
               if (e) e.stopPropagation();

               if (!item.title || !item.spotLocation || !item.assignedSupervisor) {
                   showToast("먼저 카드를 눌러 공사위치·감독자를 입력해주세요.");
                   return;
               }

               const extendTag = item.extendHour != null ? `  ${fmtExtend(item.extendHour)}` : "";
               const line1 = item.title + extendTag;
               const line2 = `  ${item.spotLocation}  감독-${item.assignedSupervisor}`;
               const dCount = parseInt(item.directWorkers, 10) || 0;
               const wCount = parseInt(item.dailyWorkers, 10) || 0;
               const pCount = parseInt(item.partnerWorkers, 10) || 0;
               const manpowerParts = [];
               if (dCount > 0) manpowerParts.push(`직${dCount}`);
               if (wCount > 0) manpowerParts.push(`일용${wCount}`);
               if (item.partnerName && pCount > 0) manpowerParts.push(`${item.partnerName} ${pCount}`);
               const line3 = manpowerParts.join(" ");

               const text = [line1, line2, line3].filter(Boolean).join("\n");

               navigator.clipboard.writeText(text).then(() => {
                   showToast("💬 카톡용 문구가 복사되었습니다.");
               }).catch(() => {
                   showToast("클립보드 복사에 실패했습니다.");
               });
           };

           const openFactoryFilter = () => {
               setFilterDraft(myFactories ? [...myFactories] : []);
               setShowFactoryFilter(true);
           };

           // (12번) 최초/미설정 시 내 공장 설정 강제 팝업
           useEffect(() => {
               if (!myFactories || myFactories.length === 0) {
                   setFilterDraft([]);
                   setShowFactoryFilter(true);
               }
           }, []);

           // 초기 활성 탭 = 첫 번째 내 공장 (없으면 전체)
           useEffect(() => {
               if (myFactories && myFactories.length > 0) {
                   setActiveTab(myFactories[0]);
               }
           }, [isLoading]);

           // 암호 확인 후 실행
           const openPwModal = (target) => {
               setPwTarget(target);
               setPwInput("");
               setPwError(false);
               setShowPwModal(true);
           };

           const confirmPw = () => {
               if (pwInput !== ADMIN_PASSWORD) {
                   setPwError(true);
                   return;
               }
               setShowPwModal(false);
               if (pwTarget === "reset") {
                   doReset();
               } else if (pwTarget === "company") {
                   setCompanyNameDraft(companyName);
                   setShowCompanyEdit(true);
               }
           };

           const toggleFilterFactory = (f) => {
               setFilterDraft(prev =>
                   prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]
               );
           };

           const saveFactoryFilter = () => {
               const sorted = SUPPORTED_FACTORIES.filter(f => filterDraft.includes(f));
               // (12번) 최소 1개 강제 — 빈 선택이면 저장/닫기 차단
               if (sorted.length === 0) {
                   showToast("내 공장을 1개 이상 선택해주세요.");
                   return;
               }
               setMyFactories(sorted);
               localStorage.setItem("MMEEC_MY_FACTORIES", JSON.stringify(sorted));
               setShowFactoryFilter(false);
               setActiveTab(sorted[0]); // 첫 번째 내 공장으로 이동
               showToast("내 공장 설정이 저장됐습니다.");
           };

           const [showCompanyEdit, setShowCompanyEdit] = useState(false);

           const saveCompanyName = () => {
               const name = companyNameDraft.trim() || "MMEEC";
               setCompanyName(name);
               localStorage.setItem("MMEEC_COMPANY_NAME", name);
               setShowCompanyEdit(false);
               showToast("회사명이 저장됐습니다.");
           };

           const doReset = async () => {
               try {
                   await MMEECStorage.clear(sessionId);
               } catch (e) {
                   console.error(e);
               }
               setItems([]);
               setSheetTitle("");
               setActiveTab("전체");
               showToast("데이터가 초기화되었습니다.");
           };

           // ═══════════════════════════════════════════════════
           // (2번) 기상 정보 — 기상청 오픈API, 2시간 캐시
           // ═══════════════════════════════════════════════════
           const [showWeather, setShowWeather] = useState(false);
           const [weather, setWeather] = useState(() => {
               try { return JSON.parse(localStorage.getItem("MMEEC_WEATHER") || "null"); } catch { return null; }
           });
           const [weatherLoading, setWeatherLoading] = useState(false);
           const [wrnExpand, setWrnExpand] = useState(false);

           const fetchWeather = async (force) => {
               const cfg = window.APP_CONFIG || {};
               if (!cfg.kmaServiceKey) { showToast("기상청 API 키가 설정되지 않았습니다."); return; }
               const TTL = 2 * 60 * 60 * 1000; // 2시간
               if (!force && weather && Date.now() - weather.ts < TTL) return;
               setWeatherLoading(true);
               const result = { ts: Date.now(), temp: null, humidity: null, warnings: [], bulletin: "", error: null };

               // 직접 호출 실패(CORS 등) 시 Apps Script 프록시 폴백
               const getJson = async (url) => {
                   try {
                       const r = await fetch(url);
                       return await r.json();
                   } catch (e) {
                       if (!cfg.sheetsWebhookUrl) throw e;
                       const pr = await fetch(`${cfg.sheetsWebhookUrl}?proxy=${encodeURIComponent(url)}`);
                       return await pr.json();
                   }
               };

               try {
                   // ① 초단기실황: 기온(T1H)·습도(REH) — 매시 정시 관측, 40분 이후 제공
                   const now = new Date(Date.now() - 45 * 60 * 1000);
                   const bd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
                   const bt = `${String(now.getHours()).padStart(2,"0")}00`;
                   const ncstUrl = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst`
                       + `?serviceKey=${encodeURIComponent(cfg.kmaServiceKey)}&dataType=JSON&numOfRows=10&pageNo=1`
                       + `&base_date=${bd}&base_time=${bt}&nx=${cfg.kmaNx || 103}&ny=${cfg.kmaNy || 84}`;
                   const j1 = await getJson(ncstUrl);
                   const obs = j1?.response?.body?.items?.item || [];
                   obs.forEach(o => {
                       if (o.category === "T1H") result.temp = o.obsrValue;
                       if (o.category === "REH") result.humidity = o.obsrValue;
                   });
               } catch (e) { console.warn("기상 실황 조회 실패:", e); result.error = "실황"; }
               try {
                   // ② 기상특보/속보 통보문 — 관할 지점 최신 메시지에서 키워드 추출
                   const wrnUrl = `https://apis.data.go.kr/1360000/WthrWrnInfoService/getWthrWrnMsg`
                       + `?serviceKey=${encodeURIComponent(cfg.kmaServiceKey)}&dataType=JSON&numOfRows=5&pageNo=1`
                       + `&stnId=${cfg.kmaWrnStnId || 159}`;
                   const j2 = await getJson(wrnUrl);
                   let msgs = j2?.response?.body?.items?.item || [];
                   if (msgs && !Array.isArray(msgs)) msgs = [msgs];
                   const allText = msgs.map(m => Object.values(m).filter(v => typeof v === "string").join(" ")).join("\n");
                   // 울산 관련 라인 우선, 없으면 전체에서 키워드 추출
                   const scope = allText.split("\n").filter(l => l.includes("울산")).join(" ") || allText;
                   const found = scope.match(/(폭염|호우|대설|강풍|풍랑|태풍|한파|건조|안개|황사)\s*(경보|주의보)/g) || [];
                   result.warnings = Array.from(new Set(found.map(s => s.replace(/\s+/g, ""))));
                   // 속보/통보문 원문 일부 (탭하여 펼침)
                   result.bulletin = allText.trim().slice(0, 600);
               } catch (e) { console.warn("기상특보 조회 실패:", e); if (!result.error) result.error = "특보"; }
               setWeather(result);
               try { localStorage.setItem("MMEEC_WEATHER", JSON.stringify(result)); } catch {}
               setWeatherLoading(false);
           };

           // 자동 갱신: 로드 시 + 10분마다 TTL 확인
           useEffect(() => {
               fetchWeather(false);
               const t = setInterval(() => fetchWeather(false), 10 * 60 * 1000);
               return () => clearInterval(t);
           }, []);

           // ═══════════════════════════════════════════════════
           // (5번) 엑셀 다운로드 — 일반: 현재 세션만
           // ═══════════════════════════════════════════════════
           const itemsToRows = (list) => list.map(it => ({
               "공장": it.factory || "", "사업장": it.company || "", "공사명": it.title || "",
               "등급": it.grade || "", "작업": it.workType || "",
               "공사위치": it.spotLocation || "", "감독자": it.assignedSupervisor || "",
               "직영": it.directWorkers || "", "일용": it.dailyWorkers || "",
               "협력사": it.partnerName || "", "협력인원": it.partnerWorkers || "",
               "상태": it.status === "checked" ? "공사중" : "공사전",
               "연장": it.extendHour != null ? fmtExtend(it.extendHour) : "",
               "작업일수": workDayCount(it) || "",
               "메모": it.memo || "",
               "체감온도기록": (it.heatResults || []).slice().reverse()
                   .map(r => `${toHm24(r) || r.time} ${fmt1(r.value)}℃(${r.level})`).join(" | "),
           }));

           const exportExcel = (list, label) => {
               if (!list || list.length === 0) { showToast("내보낼 데이터가 없습니다."); return; }
               try {
                   const ws = XLSX.utils.json_to_sheet(itemsToRows(list));
                   const wb = XLSX.utils.book_new();
                   XLSX.utils.book_append_sheet(wb, ws, "진행기록");
                   XLSX.writeFile(wb, `포켓보드_${label}_${getWorkdayKey()}.xlsx`);
                   showToast("📊 엑셀 파일이 다운로드되었습니다.");
               } catch (e) { console.error(e); showToast("엑셀 생성 실패"); }
           };

           // ═══════════════════════════════════════════════════
           // (4번) 마스터 코드 (관리자 모드) — 서버측 RPC 검증
           // ═══════════════════════════════════════════════════
           const [showMaster, setShowMaster] = useState(false);
           const [masterCode, setMasterCode] = useState("");        // 입력값 (메모리만, 저장 안 함)
           const [masterAuthed, setMasterAuthed] = useState(false);
           const [masterSessions, setMasterSessions] = useState([]);
           const [masterContacts, setMasterContacts] = useState(null); // null=미로드
           const [masterBusy, setMasterBusy] = useState(false);
           const [regCode, setRegCode] = useState("");
           const [regName, setRegName] = useState("");
           const [ctName, setCtName] = useState("");
           const [ctPhone, setCtPhone] = useState("");
           const [ctFactory, setCtFactory] = useState("");

           const rpc = async (fn, params) => {
               const cfg = window.APP_CONFIG || {};
               const res = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/${fn}`, {
                   method: "POST",
                   headers: {
                       apikey: cfg.supabaseKey,
                       Authorization: `Bearer ${cfg.supabaseKey}`,
                       "Content-Type": "application/json",
                   },
                   body: JSON.stringify(params),
               });
               if (!res.ok) throw new Error(`RPC ${fn} 실패 (${res.status})`);
               const text = await res.text();
               return text ? JSON.parse(text) : null;
           };

           const masterLogin = async () => {
               if (!masterCode.trim()) { showToast("마스터 코드를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   const rows = await rpc("master_list_sessions", { p_code: masterCode.trim() });
                   setMasterSessions(rows || []);
                   setMasterAuthed(true);
               } catch (e) {
                   console.error(e);
                   showToast("마스터 코드가 올바르지 않거나 서버 설정(supabase-master-v3.sql)이 미적용 상태입니다.");
               } finally { setMasterBusy(false); }
           };

           const masterRefreshSessions = async () => {
               try { setMasterSessions(await rpc("master_list_sessions", { p_code: masterCode.trim() }) || []); }
               catch (e) { showToast("목록 갱신 실패"); }
           };

           const masterAddSession = async () => {
               if (!regCode.trim()) { showToast("세션 코드를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   await rpc("master_upsert_session", { p_code: masterCode.trim(), p_session: regCode.trim(), p_site: regName.trim() || regCode.trim() });
                   setRegCode(""); setRegName("");
                   await masterRefreshSessions();
                   showToast("현장 코드가 등록되었습니다.");
               } catch (e) { showToast("등록 실패"); } finally { setMasterBusy(false); }
           };

           const masterDeleteSession = async (code) => {
               setMasterBusy(true);
               try {
                   await rpc("master_delete_session", { p_code: masterCode.trim(), p_session: code });
                   await masterRefreshSessions();
                   showToast("삭제되었습니다.");
               } catch (e) { showToast("삭제 실패"); } finally { setMasterBusy(false); }
           };

           const masterExportAll = async () => {
               setMasterBusy(true);
               try {
                   const rows = await rpc("master_export", { p_code: masterCode.trim() }) || [];
                   if (rows.length === 0) { showToast("내보낼 세션 데이터가 없습니다."); return; }
                   const wb = XLSX.utils.book_new();
                   rows.forEach(r => {
                       const list = Array.isArray(r.items) ? r.items : [];
                       const ws = XLSX.utils.json_to_sheet(itemsToRows(list));
                       const name = String(r.site_name || r.session_id).slice(0, 28).replace(/[\\\/\?\*\[\]:]/g, "_") || "세션";
                       XLSX.utils.book_append_sheet(wb, ws, name);
                   });
                   XLSX.writeFile(wb, `포켓보드_전체통합_${getWorkdayKey()}.xlsx`);
                   showToast("📊 전체 통합 엑셀이 다운로드되었습니다.");
               } catch (e) { console.error(e); showToast("전체 내보내기 실패"); }
               finally { setMasterBusy(false); }
           };

           const masterLoadContacts = async () => {
               setMasterBusy(true);
               try { setMasterContacts(await rpc("master_list_contacts", { p_code: masterCode.trim() }) || []); }
               catch (e) { showToast("연락처 조회 실패"); }
               finally { setMasterBusy(false); }
           };

           const masterAddContact = async () => {
               if (!ctName.trim() || !ctPhone.trim()) { showToast("이름과 연락처를 입력해주세요."); return; }
               setMasterBusy(true);
               try {
                   await rpc("master_upsert_contact", { p_code: masterCode.trim(), p_name: ctName.trim(), p_phone: ctPhone.trim(), p_factory: ctFactory.trim() });
                   setCtName(""); setCtPhone(""); setCtFactory("");
                   await masterLoadContacts();
               } catch (e) { showToast("연락처 저장 실패"); } finally { setMasterBusy(false); }
           };

           const masterDeleteContact = async (id) => {
               setMasterBusy(true);
               try { await rpc("master_delete_contact", { p_code: masterCode.trim(), p_id: id }); await masterLoadContacts(); }
               catch (e) { showToast("삭제 실패"); } finally { setMasterBusy(false); }
           };

           const closeMaster = () => {
               setShowMaster(false); setMasterAuthed(false); setMasterCode("");
               setMasterSessions([]); setMasterContacts(null);
           };

           // (3번) PWA 설치 안내 배너 — 최초 1회
           const [showInstall, setShowInstall] = useState(() =>
               !localStorage.getItem("MMEEC_INSTALL_HINTED") &&
               !window.matchMedia("(display-mode: standalone)").matches
           );
           const doInstall = async () => {
               localStorage.setItem("MMEEC_INSTALL_HINTED", "1");
               const p = window.__PWA_PROMPT__;
               if (p) { p.prompt(); try { await p.userChoice; } catch {} window.__PWA_PROMPT__ = null; }
               setShowInstall(false);
           };
           const dismissInstall = () => {
               localStorage.setItem("MMEEC_INSTALL_HINTED", "1");
               setShowInstall(false);
           };

           return (
               <div class="max-w-md mx-auto bg-slate-50 min-h-screen pb-32 flex flex-col relative shadow-xl">
                   
                   {/* 상단 헤더 영역 */}
                   <header class="bg-white border-b border-slate-200 px-4 py-4 shadow-xs">
                       <div class="flex items-center justify-between mb-3">
                           {/* 회사명 버튼 + 앱 제목 */}
                           <div class="flex items-center gap-2">
                               <button
                                   onClick={() => openPwModal("company")}
                                   class="bg-slate-900 text-amber-400 font-black text-sm px-2.5 py-1 rounded-lg active:scale-95 transition-all"
                               >
                                   {companyName}
                               </button>
                               <div>
                                   <h1 class="text-xl font-bold text-slate-900 tracking-tight">포켓보드 <span class="text-amber-500 font-black">PRO</span></h1>
                               </div>
                           </div>
                           {/* 우측 버튼 그룹 */}
                           <div class="flex items-center gap-1.5">
                               {items.length > 0 && (
                                   <button onClick={() => openPwModal("reset")} class="text-xs text-rose-500 bg-rose-50 px-2.5 py-1.5 rounded-lg font-medium active:scale-95 transition-all">
                                       초기화
                                   </button>
                               )}
                               <button onClick={() => { setShowWeather(true); fetchWeather(false); }} class="text-xs bg-sky-50 text-sky-600 px-2.5 py-1.5 rounded-lg font-medium active:scale-95 transition-all">
                                   🌤️
                               </button>
                               {/* (3) 엑셀 다운로드 버튼 — 요청에 따라 숨김 (기능은 유지)
                               {items.length > 0 && (
                                   <button onClick={() => exportExcel(items, sessionId)} class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1.5 rounded-lg font-medium active:scale-95 transition-all">
                                       📊
                                   </button>
                               )} */}
                               <button onClick={openFactoryFilter} class={`text-xs px-2.5 py-1.5 rounded-lg font-medium active:scale-95 transition-all ${myFactories ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-600"}`}>
                                   🏭 내 공장
                               </button>
                               <button onClick={() => setShowInfo(true)} class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1.5 rounded-lg font-medium active:scale-95 transition-all">
                                   ℹ️
                               </button>
                           </div>
                       </div>

                       <button
                           onClick={() => { setSessionInput(sessionId); setShowSessionModal(true); }}
                           class="w-full mb-3 flex items-center justify-between bg-slate-100 hover:bg-slate-200 rounded-xl px-3 py-2.5 active:scale-[0.99] transition-all"
                       >
                           <span class="text-xs text-slate-500 font-semibold">공사 코드</span>
                           <span class="text-sm font-black text-slate-800">{sessionId}</span>
                       </button>
                       {sheetTitle && (
                           <p class="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2 mb-3 font-semibold truncate">{sheetTitle}</p>
                       )}

                       <div class="flex gap-2">
                           <div class="relative group flex-1">
                               <input 
                                   type="file" 
                                   id="excel-upload" 
                                   accept=".xlsx, .xls, .csv" 
                                   onChange={handleFileUpload} 
                                   class="hidden" 
                               />
                               <label 
                                   htmlFor="excel-upload" 
                                   class="w-full flex items-center justify-center gap-2 bg-slate-900 text-white font-medium text-sm py-3 px-4 rounded-xl cursor-pointer active:scale-[0.98] transition-all shadow-sm"
                               >
                                   <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                       <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"/>
                                   </svg>
                                   {items.length > 0 ? "파일 변경" : "엑셀/CSV 선택"}
                               </label>
                           </div>
                           <button
                               onClick={() => { setAddModalTab("urgent"); setShowAddModal(true); }}
                               class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm py-3 px-4 rounded-xl active:scale-[0.97] transition-all shadow-sm whitespace-nowrap"
                           >
                               <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                   <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"/>
                               </svg>
                               긴급공사
                           </button>
                       </div>
                   </header>

                   {/* 공장 가로 스크롤 탭 메뉴 */}
                   {items.length > 0 && (
                       <div class="bg-white border-b border-slate-100 sticky top-0 z-30 px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar shadow-xs">
                           {activeFactories.map(factory => {
                               const count = factory === "전체" ? items.length : items.filter(i => i.factory === factory).length;
                               const pendingCount = factory === "전체" ? items.filter(i => i.status === "pending").length : items.filter(i => i.factory === factory && i.status === "pending").length;
                               const isActive = activeTab === factory;
                               
                               return (
                                   <button
                                       key={factory}
                                       onClick={() => setActiveTab(factory)}
                                       class={`flex-shrink-0 min-w-[70px] px-3.5 py-2 rounded-xl text-base font-semibold tracking-tight transition-all active:scale-95 flex items-center gap-1.5 ${
                                           isActive 
                                           ? "bg-amber-500 text-white shadow-sm shadow-amber-200" 
                                           : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                                       }`}
                                   >
                                       <span>{factory}</span>
                                       <span class={`px-1 py-0.2 rounded-md text-sm ${isActive ? "bg-amber-600 text-white" : "bg-slate-200 text-slate-700"}`}>
                                           {pendingCount > 0 ? `${pendingCount}/${count}` : count}
                                       </span>
                                   </button>
                               );
                           })}
                       </div>
                   )}

                   {/* 메인 대시보드 리스트 */}
                   <main class="p-4 flex-1">
                       {isLoading ? (
                           <div class="flex flex-col items-center justify-center py-24 text-center">
                               <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4" />
                               <p class="text-sm text-slate-500 font-semibold">데이터 불러오는 중…</p>
                           </div>
                       ) : items.length === 0 ? (
                           <div class="flex flex-col items-center justify-center py-20 text-center px-6">
                               <div class="w-16 h-16 bg-amber-50 rounded-2xl flex items-center justify-center mb-4">
                                   <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                       <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"/>
                                   </svg>
                               </div>
                               <h3 class="text-sm font-bold text-slate-800">로딩된 주말 공사 목록이 없습니다</h3>
                               <p class="text-xs text-slate-400 mt-1.5 max-w-[240px] leading-relaxed">
                                   상단의 검은색 버튼을 눌러 관리 PC에서 가져온 주말공사 엑셀 내역 파일을 선택해주세요.
                               </p>
                           </div>
                       ) : (
                           <div class="space-y-3.5">
                               <div class="flex items-center justify-between px-1">
                                   <span class="text-sm font-bold text-slate-400">공사 목록 ({filteredItems.length}건)</span>
                                   <span class="text-sm bg-slate-200/70 text-slate-600 px-2 py-0.5 rounded-md font-medium">터치 시 기록/편집</span>

                                           마지막 갱신: {new Date(weather.ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}
                                           {weather.error && <span class="text-rose-400"> · {weather.error} 조회 실패</span>}
                                           <span class="block mt-0.5">2시간마다 자동 갱신</span>
                                       </p>
                                   </div>
                               ) : (
                                   <p class="text-sm text-slate-400 text-center py-6">{weatherLoading ? "불러오는 중…" : "데이터 없음 — 새로고침을 눌러주세요"}</p>
                               )}
                               <div class="grid grid-cols-2 gap-3">
                                   <button onClick={() => fetchWeather(true)} disabled={weatherLoading}
                                       class="w-full bg-sky-500 text-white font-bold py-3 rounded-2xl text-sm active:scale-95 transition-all disabled:opacity-50">
                                       {weatherLoading ? "갱신 중…" : "🔄 새로고침"}
                                   </button>
                                   <button onClick={() => setShowWeather(false)} class="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl text-sm active:scale-95 transition-all">닫기</button>
                               </div>
                           </div>
                       </div>
                   )}

                   {/* ══ (1번) 체감온도 미측정 경고 팝업 ══ */}
                   {heatWarn && (
                       <div class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center px-6">
                           <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 text-center">
                               <div class="text-4xl">🌡️⚠️</div>
                               <h2 class="text-lg font-black text-slate-900">체감온도 측정 필요</h2>
                               <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-line">{heatWarn}</p>
                               <button onClick={() => setHeatWarn(null)} class="w-full bg-amber-500 text-white font-bold py-3.5 rounded-2xl text-base active:scale-95 transition-all">확인</button>
                           </div>
                       </div>
                   )}

                   {/* ══ (4번) 마스터(관리자) 모드 ══ */}
                   {showMaster && (
                       <div class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center">
                           <div class="bg-white rounded-t-[28px] sm:rounded-3xl w-full max-w-md p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                               <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4" />
                               <h3 class="text-lg font-black text-slate-900 mb-1">🔑 관리자(마스터) 모드</h3>

                               {!masterAuthed ? (
                                   <div class="space-y-3 mt-3">
                                       <p class="text-xs text-slate-400 leading-relaxed">마스터 코드는 서버에서 검증됩니다.<br/>일반 사용자에게는 연락처 등 관리자 데이터가 전송되지 않습니다.</p>
                                       <input type="password" value={masterCode} onChange={(e) => setMasterCode(e.target.value)}
                                           onKeyDown={(e) => e.key === "Enter" && masterLogin()}
                                           placeholder="마스터 코드 입력"
                                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-amber-500 min-h-[52px]" autoFocus />
                                       <div class="grid grid-cols-2 gap-3">
                                           <button onClick={closeMaster} class="w-full bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl min-h-[52px]">취소</button>
                                           <button onClick={masterLogin} disabled={masterBusy}
                                               class="w-full bg-slate-900 text-amber-400 font-bold py-3.5 rounded-xl min-h-[52px] disabled:opacity-50">
                                               {masterBusy ? "확인 중…" : "인증"}
                                           </button>
                                       </div>
                                   </div>
                               ) : (
                                   <div class="space-y-5 mt-3">
                                       {/* 전체 엑셀 */}
                                       <button onClick={masterExportAll} disabled={masterBusy}
                                           class="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-base active:scale-95 transition-all disabled:opacity-50">
                                           📊 전체 현장 통합 엑셀 다운로드
                                       </button>

                                       {/* 세션 등록소 */}
                                       <div class="space-y-2">
                                           <p class="text-base font-bold text-slate-800">🏗️ 현장(세션) 등록소</p>
                                           <div class="space-y-1.5 max-h-[180px] overflow-y-auto">
                                               {masterSessions.length === 0 && <p class="text-xs text-slate-400 py-2">등록된 현장이 없습니다.</p>}
                                               {masterSessions.map(s => (
                                                   <div key={s.session_code} class="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                                                       <div class="flex-1 min-w-0">
                                                           <p class="text-sm font-bold text-slate-800 truncate">{s.site_name}</p>
                                                           <p class="text-xs text-slate-400 truncate">{s.session_code}</p>
                                                       </div>
                                                       <button onClick={() => { MMEECStorage.setSessionId(s.session_code); setSessionId(s.session_code); closeMaster(); showToast(`[${s.site_name}] 세션으로 이동`); }}
                                                           class="text-xs bg-amber-100 text-amber-700 font-bold px-2.5 py-1.5 rounded-lg active:scale-95">열기</button>
                                                       <button onClick={() => masterDeleteSession(s.session_code)}
                                                           class="text-xs bg-rose-50 text-rose-500 font-bold px-2.5 py-1.5 rounded-lg active:scale-95">삭제</button>
                                                   </div>
                                               ))}
                                           </div>
                                           <div class="flex gap-2">
                                               <input type="text" value={regCode} onChange={(e) => setRegCode(e.target.value.replace(/\s/g,""))} placeholder="세션 코드"
                                                   class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                               <input type="text" value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="현장명"
                                                   class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                               <button onClick={masterAddSession} disabled={masterBusy}
                                                   class="bg-slate-900 text-amber-400 font-bold px-3 rounded-xl text-sm active:scale-95 disabled:opacity-50">등록</button>
                                           </div>
                                       </div>

                                       {/* 연락처 (서버 보관) */}
                                       <div class="space-y-2">
                                           <div class="flex items-center justify-between">
                                               <p class="text-base font-bold text-slate-800">📞 감독자 연락처 <span class="text-xs font-normal text-slate-400">(서버 보관)</span></p>
                                               {masterContacts === null && (
                                                   <button onClick={masterLoadContacts} disabled={masterBusy}
                                                       class="text-xs bg-slate-100 text-slate-600 font-bold px-2.5 py-1.5 rounded-lg active:scale-95">불러오기</button>
                                               )}
                                           </div>
                                           {masterContacts !== null && (
                                               <>
                                                   <div class="space-y-1.5 max-h-[160px] overflow-y-auto">
                                                       {masterContacts.length === 0 && <p class="text-xs text-slate-400 py-2">등록된 연락처가 없습니다.</p>}
                                                       {masterContacts.map(c => (
                                                           <div key={c.id} class="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                                                               <div class="flex-1 min-w-0">
                                                                   <p class="text-sm font-bold text-slate-800">{c.name} <span class="text-xs font-normal text-slate-400">{c.factory}</span></p>
                                                                   <a href={`tel:${c.phone}`} class="text-xs text-sky-600 font-semibold">{c.phone}</a>
                                                               </div>
                                                               <button onClick={() => masterDeleteContact(c.id)}
                                                                   class="text-xs bg-rose-50 text-rose-500 font-bold px-2.5 py-1.5 rounded-lg active:scale-95">삭제</button>
                                                           </div>
                                                       ))}
                                                   </div>
                                                   <div class="grid grid-cols-3 gap-2">
                                                       <input type="text" value={ctName} onChange={(e) => setCtName(e.target.value)} placeholder="이름"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                       <input type="tel" value={ctPhone} onChange={(e) => setCtPhone(e.target.value)} placeholder="연락처"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                       <input type="text" value={ctFactory} onChange={(e) => setCtFactory(e.target.value)} placeholder="공장"
                                                           class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                                                   </div>
                                                   <button onClick={masterAddContact} disabled={masterBusy}
                                                       class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm active:scale-95 disabled:opacity-50">연락처 추가</button>
                                               </>
                                           )}
                                       </div>

                                       <button onClick={closeMaster} class="w-full bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl text-base active:scale-95 transition-all">닫기</button>
                                   </div>
                               )}
                           </div>
                       </div>
                   )}

                   {/* ══ (3번) 홈화면 설치 안내 (최초 1회) ══ */}
                   {showInstall && !isLoading && (
                       <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-2xl p-4 shadow-2xl z-40 flex items-center gap-3">
                           <div class="text-2xl">📲</div>
                           <div class="flex-1 min-w-0">
                               <p class="text-sm font-bold">홈 화면에 추가하면 앱처럼 쓸 수 있어요</p>
                               <p class="text-xs text-slate-400 mt-0.5">
                                   {window.__PWA_PROMPT__ ? "아래 버튼 한 번이면 설치 완료" :
                                    /iPhone|iPad/i.test(navigator.userAgent) ? "Safari 공유(⬆️) → \"홈 화면에 추가\"" :
                                    "브라우저 메뉴(⋮) → \"홈 화면에 추가\""}
                               </p>
                           </div>
                           {window.__PWA_PROMPT__ && (
                               <button onClick={doInstall} class="bg-amber-400 text-slate-900 text-xs font-black px-3 py-2 rounded-xl active:scale-95">설치</button>
                           )}
                           <button onClick={dismissInstall} class="text-slate-400 text-lg font-bold px-1">✕</button>
                       </div>
                   )}

                   {/* ══ (3번) iOS 카톡 인앱 안내 오버레이 ══ */}
                   {window.__KAKAO_IOS__ && (
                       <div class="fixed inset-0 bg-slate-900/95 z-[70] flex items-center justify-center px-8 text-center">
                           <div class="text-white space-y-4">
                               <div class="text-5xl">🧭</div>
                               <h2 class="text-xl font-black">기본 브라우저로 열어주세요</h2>
                               <p class="text-sm text-slate-300 leading-relaxed">
                                   카카오톡 안에서는 일부 기능이 제한됩니다.<br/>
                                   우측 하단 <span class="font-black text-amber-400">⋯ 메뉴</span> →
                                   <span class="font-black text-amber-400"> "다른 브라우저로 열기"</span>를 눌러주세요.
                               </p>
                           </div>
                       </div>
                   )}

               </div>
           );
       }

       const container = document.getElementById('root');
       const root = ReactDOM.createRoot(container);
       root.render(<App />);
   </script>
</body>
</html>
